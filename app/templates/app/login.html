<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Box Planner</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            line-height: 1.4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary);
        }

        .nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            background: #64748b;
        }

        button.secondary:hover {
            background: #475569;
        }

        button.danger {
            background: var(--danger);
        }

        button.small {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        /* ===== DAY BOX ===== */
        .day-box {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .day-box.today {
            border-color: var(--primary);
        }

        .day-header {
            background: #f8fafc;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--border);
        }

        .day-header:hover {
            background: #f1f5f9;
        }

        .day-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .day-title .weekday {
            color: var(--muted);
            font-weight: 500;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        .indicators {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.note {
            background: #3b82f6;
        }

        .dot.goal {
            background: #8b5cf6;
        }

        .dot.task {
            background: #10b981;
        }

        .dot.budget {
            background: #f59e0b;
        }

        .day-body {
            display: none;
            padding: 16px;
        }

        .day-box.open .day-body {
            display: block;
        }

        .day-box.open .day-header {
            background: #eef2ff;
        }

        .section {
            margin-bottom: 18px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section h3 {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }

        textarea,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            margin-bottom: 6px;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .task-text.done {
            text-decoration: line-through;
            color: var(--muted);
        }

        .add-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem;
        }

        .budget-item:last-child {
            border-bottom: none;
        }

        .budget-amount.income {
            color: var(--success);
        }

        .budget-amount.expense {
            color: var(--danger);
        }

        .budget-form {
            display: grid;
            grid-template-columns: 1fr 90px 90px 40px;
            gap: 6px;
            margin-top: 8px;
        }

        .budget-summary {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--danger);
        }

        .empty {
            color: var(--muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .budget-form {
                grid-template-columns: 1fr 1fr;
            }

            .budget-form button {
                grid-column: span 2;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📅 Date Box Planner</h1>
            <div class="nav">
                <button class="secondary" onclick="changeMonth(-1)">← Prev</button>
                <span id="monthLabel" style="font-weight:600; min-width:140px; text-align:center;"></span>
                <button class="secondary" onclick="changeMonth(1)">Next →</button>
                <button onclick="goToday()">Today</button>
            </div>
        </header>

        <div id="daysContainer"></div>
    </div>

    <script>
        let current = new Date();
        let data = JSON.parse(localStorage.getItem('dateBoxPlanner') || '{}');

        function formatDate(d) {
            return d.toISOString().split('T')[0];
        }

        function getDayData(dateStr) {
            if (!data[dateStr]) {
                data[dateStr] = { notes: '', goals: '', tasks: [], budget: [] };
            }
            return data[dateStr];
        }

        function save() {
            localStorage.setItem('dateBoxPlanner', JSON.stringify(data));
        }

        function changeMonth(dir) {
            current.setMonth(current.getMonth() + dir);
            render();
        }

        function goToday() {
            current = new Date();
            render();
            // open today's box
            setTimeout(() => {
                const todayBox = document.querySelector('.day-box.today');
                if (todayBox) {
                    todayBox.classList.add('open');
                    todayBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 50);
        }

        function toggleDay(dateStr) {
            const box = document.getElementById('box-' + dateStr);
            box.classList.toggle('open');
        }

        function render() {
            const year = current.getFullYear();
            const month = current.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDate(new Date());

            document.getElementById('monthLabel').textContent =
                current.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dateObj = new Date(dateStr + 'T00:00:00');
                const dayData = getDayData(dateStr);
                const isToday = dateStr === todayStr;

                // indicators
                let dots = '';
                if (dayData.notes) dots += '<span class="dot note" title="Notes"></span>';
                if (dayData.goals) dots += '<span class="dot goal" title="Goals"></span>';
                if (dayData.tasks.length) dots += '<span class="dot task" title="Tasks"></span>';
                if (dayData.budget.length) dots += '<span class="dot budget" title="Budget"></span>';

                const weekday = dateObj.toLocaleDateString('en-IN', { weekday: 'short' });

                const box = document.createElement('div');
                box.className = 'day-box' + (isToday ? ' today' : '');
                box.id = 'box-' + dateStr;

                box.innerHTML = `
          <div class="day-header" onclick="toggleDay('${dateStr}')">
            <div class="day-title">
              ${d} <span class="weekday">${weekday}</span>
              ${isToday ? ' • Today' : ''}
            </div>
            <div class="indicators">${dots}</div>
          </div>

          <div class="day-body">
            <!-- NOTES -->
            <div class="section">
              <h3>📝 Notes</h3>
              <textarea id="notes-${dateStr}" placeholder="Write notes for this day...">${dayData.notes || ''}</textarea>
            </div>

            <!-- GOALS -->
            <div class="section">
              <h3>🎯 Goals for this day</h3>
              <textarea id="goals-${dateStr}" placeholder="What do you want to achieve?">${dayData.goals || ''}</textarea>
            </div>

            <!-- TASKS -->
            <div class="section">
              <h3>✅ Tasks / To-Do</h3>
              <div id="tasks-${dateStr}">
                ${renderTasksHTML(dayData.tasks, dateStr)}
              </div>
              <div class="add-row">
                <input type="text" id="newtask-${dateStr}" placeholder="Add a new task...">
                <button class="small" onclick="addTask('${dateStr}')">Add</button>
              </div>
            </div>

            <!-- BUDGET -->
            <div class="section">
              <h3>💰 Budget / Expenses</h3>
              <div id="budget-${dateStr}">
                ${renderBudgetHTML(dayData.budget, dateStr)}
              </div>
              <div class="budget-form">
                <input type="text" id="bdesc-${dateStr}" placeholder="Description">
                <input type="number" id="bamount-${dateStr}" placeholder="Amount" step="0.01">
                <select id="btype-${dateStr}" style="padding:9px; border-radius:8px; border:1px solid var(--border);">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
                <button class="small" onclick="addBudget('${dateStr}')">+</button>
              </div>
              <div class="budget-summary">
                <span>Daily Balance:</span>
                <span id="balance-${dateStr}">${calcBalance(dayData.budget)}</span>
              </div>
            </div>

            <div class="actions">
              <button onclick="saveDay('${dateStr}')">💾 Save Day</button>
              <button class="danger small" onclick="clearDay('${dateStr}')">Clear Day</button>
            </div>
          </div>
        `;

                container.appendChild(box);
            }
        }

        function renderTasksHTML(tasks, dateStr) {
            if (!tasks || tasks.length === 0) {
                return '<div class="empty">No tasks yet</div>';
            }
            return tasks.map((t, i) => `
        <div class="task-item">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${dateStr}', ${i})">
          <span class="task-text ${t.done ? 'done' : ''}" style="flex:1">${t.text}</span>
          <button class="danger small" onclick="deleteTask('${dateStr}', ${i})">✕</button>
        </div>
      `).join('');
        }

        function renderBudgetHTML(items, dateStr) {
            if (!items || items.length === 0) {
                return '<div class="empty">No budget entries</div>';
            }
            return items.map((b, i) => `
        <div class="budget-item">
          <span>${b.desc}</span>
          <div>
            <span class="budget-amount ${b.type}">${b.type === 'income' ? '+' : '-'}₹${Number(b.amount).toFixed(2)}</span>
            <button class="danger small" style="margin-left:8px" onclick="deleteBudget('${dateStr}', ${i})">✕</button>
          </div>
        </div>
      `).join('');
        }

        function calcBalance(items) {
            let bal = 0;
            (items || []).forEach(i => {
                bal += i.type === 'income' ? Number(i.amount) : -Number(i.amount);
            });
            const cls = bal >= 0 ? 'positive' : 'negative';
            return `<span class="${cls}">₹${bal.toFixed(2)}</span>`;
        }

        // ===== ACTIONS =====
        function addTask(dateStr) {
            const input = document.getElementById('newtask-' + dateStr);
            const text = input.value.trim();
            if (!text) return;

            const day = getDayData(dateStr);
            day.tasks.push({ text, done: false });
            input.value = '';
            document.getElementById('tasks-' + dateStr).innerHTML = renderTasksHTML(day.tasks, dateStr);
            save();
            updateIndicators(dateStr);
        }

        function toggleTask(dateStr, index) {
            const day = getDayData(dateStr);
            day.tasks[index].done = !day.tasks[index].done;
            document.getElementById('tasks-' + dateStr).innerHTML = renderTasksHTML(day.tasks, dateStr);
            save();
        }

        function deleteTask(dateStr, index) {
            const day = getDayData(dateStr);
            day.tasks.splice(index, 1);
            document.getElementById('tasks-' + dateStr).innerHTML = renderTasksHTML(day.tasks, dateStr);
            save();
            updateIndicators(dateStr);
        }

        function addBudget(dateStr) {
            const desc = document.getElementById('bdesc-' + dateStr).value.trim();
            const amount = parseFloat(document.getElementById('bamount-' + dateStr).value);
            const type = document.getElementById('btype-' + dateStr).value;

            if (!desc || isNaN(amount) || amount <= 0) {
                alert('Enter valid description and amount');
                return;
            }

            const day = getDayData(dateStr);
            day.budget.push({ desc, amount, type });

            document.getElementById('bdesc-' + dateStr).value = '';
            document.getElementById('bamount-' + dateStr).value = '';
            document.getElementById('budget-' + dateStr).innerHTML = renderBudgetHTML(day.budget, dateStr);
            document.getElementById('balance-' + dateStr).innerHTML = calcBalance(day.budget);
            save();
            updateIndicators(dateStr);
        }

        function deleteBudget(dateStr, index) {
            const day = getDayData(dateStr);
            day.budget.splice(index, 1);
            document.getElementById('budget-' + dateStr).innerHTML = renderBudgetHTML(day.budget, dateStr);
            document.getElementById('balance-' + dateStr).innerHTML = calcBalance(day.budget);
            save();
            updateIndicators(dateStr);
        }

        function saveDay(dateStr) {
            const day = getDayData(dateStr);
            day.notes = document.getElementById('notes-' + dateStr).value;
            day.goals = document.getElementById('goals-' + dateStr).value;
            save();
            updateIndicators(dateStr);
            alert('Saved!');
        }

        function clearDay(dateStr) {
            if (!confirm('Clear everything for this day?')) return;
            data[dateStr] = { notes: '', goals: '', tasks: [], budget: [] };
            save();
            // re-render just this box
            const wasOpen = document.getElementById('box-' + dateStr).classList.contains('open');
            render();
            if (wasOpen) {
                document.getElementById('box-' + dateStr).classList.add('open');
            }
        }

        function updateIndicators(dateStr) {
            // simple way: just re-render whole month (fast enough)
            const openBoxes = [...document.querySelectorAll('.day-box.open')].map(b => b.id);
            render();
            openBoxes.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('open');
            });
        }

        // Enter key support for tasks
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter' && e.target.id.startsWith('newtask-')) {
                const dateStr = e.target.id.replace('newtask-', '');
                addTask(dateStr);
            }
        });

        // Start
        render();
        // Auto-open today
        setTimeout(() => {
            const todayBox = document.querySelector('.day-box.today');
            if (todayBox) {
                todayBox.classList.add('open');
            }
        }, 100);
    </script>
</body>

</html>
