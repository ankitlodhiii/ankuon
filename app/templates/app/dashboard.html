                                                                        ))}
                                                                    </div>
                                                                    {kycDetailOpen === 'identity' && user.kycData && (
                                                                        <div className="p-3 bg-gray-50 rounded-lg border border-gray-200 dark:bg-gray-700 dark:border-gray-600 text-xs space-y-1">
                                                                            <p className="font-medium text-gray-800 dark:text-gray-200 mb-1">Identity details</p>
                                                                            <p className="text-gray-500">PAN: <span className="text-gray-800 dark:text-gray-200">{maskPan(user.kycData.pan)}</span></p>
                                                                            <p className="text-gray-500">Aadhaar: <span className="text-gray-800 dark:text-gray-200">{maskAadhaar(user.kycData.aadhaar)}</span></p>
                                                                        </div>
                                                                    )}
                                                                    {kycDetailOpen === 'mobile' && user.kycData && (
                                                                        <div className="p-3 bg-gray-50 rounded-lg border border-gray-200 dark:bg-gray-700 dark:border-gray-600 text-xs space-y-1">
                                                                            <p className="font-medium text-gray-800 dark:text-gray-200 mb-1">Mobile linked to Aadhaar</p>
                                                                            <p className="text-gray-500">Mobile: <span className="text-gray-800 dark:text-gray-200">{maskMobile(user.kycData.mobile)}</span></p>
                                                                            <p className="text-green-600">Aadhaar–Mobile link verified</p>
                                                                        </div>
                                                                    )}
                                                                    {kycDetailOpen === 'bank' && user.kycData && (
                                                                        <div className="p-3 bg-gray-50 rounded-lg border border-gray-200 dark:bg-gray-700 dark:border-gray-600 text-xs space-y-1">
                                                                            <p className="font-medium text-gray-800 dark:text-gray-200 mb-1">Primary payout bank</p>
                                                                            {user.kycData.bankAccount ? (
                                                                                <>
                                                                                    <p className="text-gray-500">Account: <span className="text-gray-800 dark:text-gray-200">{maskBank(user.kycData.bankAccount)}</span></p>
                                                                                    {user.kycData.accountName && <p className="text-gray-500">Name: {user.kycData.accountName}</p>}
                                                                                    {user.kycData.ifsc && <p className="text-gray-500">IFSC: {user.kycData.ifsc}</p>}
                                                                                    <p className="text-green-600">Verified · NEFT / RTGS / IMPS</p>
                                                                                </>
                                                                            ) : (
                                                                                <p className="text-orange-600">No bank linked</p>
                                                                            )}
                                                                        </div>
                                                                    )}
                                                                    <p className="text-[10px] text-gray-400 text-center">Tap a status above to view details</p>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {/* Primary Payout */}
                                                        <div className="pt-3 border-t border-gray-200 dark:border-gray-600 space-y-2">
                                                            <p className="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Primary Payout Method</p>
                                                            {user.kycData?.bankAccount ? (
                                                                <div className="p-3 bg-gray-50 rounded-lg border border-gray-200 dark:bg-gray-700 dark:border-gray-600 space-y-1">
                                                                    <div className="flex items-center justify-between">
                                                                        <p className="text-sm font-medium text-gray-800 dark:text-gray-200">Verified Bank Account</p>
                                                                        <span className="text-xs text-green-600 dark:text-green-400 font-medium flex items-center">
                                                                            <i className="fas fa-check-circle mr-1"></i> Verified
                                                                        </span>
                                                                    </div>
                                                                    <p className="text-sm text-gray-700 dark:text-gray-300">{maskBank(user.kycData.bankAccount)}</p>
                                                                    {user.kycData.accountName && (
                                                                        <p className="text-xs text-gray-500 dark:text-gray-400">{user.kycData.accountName}</p>
                                                                    )}
                                                                    {user.kycData.ifsc && (
                                                                        <p className="text-xs text-gray-500 dark:text-gray-400">IFSC: {user.kycData.ifsc}</p>
                                                                    )}
                                                                    <p className="text-xs text-gray-400 mt-1">Payouts via NEFT / RTGS / IMPS only</p>
                                                                </div>
                                                            ) : (
                                                                <div className="space-y-2">
                                                                    <p className="text-sm text-orange-600 dark:text-orange-400 flex items-center">
                                                                        <i className="fas fa-exclamation-circle mr-2"></i>
                                                                        No verified bank account linked
                                                                    </p>
                                                                    <p className="text-xs text-gray-500 dark:text-gray-400">
                                                                        Complete KYC and link your bank account. All withdrawals are paid only to your verified bank account.
                                                                    </p>
                                                                    {user.kycStatus !== 'Verified' && (
                                                                        <button type="button" onClick={handleKycVerification}
                                                                            className="w-full p-2.5 bg-blue-600 text-white rounded-lg btn-primary text-sm font-medium">
                                                                            Complete KYC & Link Bank
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* LAYER 3 — Activity & Disclosure */}
                                            <div className="rounded-xl border border-gray-200 overflow-hidden dark:border-gray-600">
                                                <button
                                                    type="button"
                                                    onClick={() => toggleLayer(3)}
                                                    className="w-full flex items-center justify-between p-4 bg-gray-50 hover:bg-gray-100 transition dark:bg-gray-700/40 dark:hover:bg-gray-700"
                                                >
                                                    <span className="flex items-center text-base font-semibold text-gray-800 dark:text-gray-200">
                                                        <i className="fas fa-history mr-2 text-blue-600"></i>
                                                        Activity & Disclosure
                                                    </span>
                                                    <i className={`fas fa-chevron-${openLayer === 3 ? 'up' : 'down'} text-gray-500`}></i>
                                                </button>
                                                {openLayer === 3 && (
                                                    <div className="p-4 space-y-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-600">
                                                        {/* Security Activity */}
                                                        <div className="space-y-2">
                                                            <p className="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Security Activity</p>
                                                            <div className="space-y-2 text-xs">
                                                                {(user.securityLog || []).slice(-5).reverse().map((log, i) => (
                                                                    <div key={i} className="flex justify-between items-center p-2 bg-gray-50 rounded-lg dark:bg-gray-700">
                                                                        <div>
                                                                            <p className="font-medium text-gray-800 dark:text-gray-200">{(log.action || '').replace(/_/g, ' ')}</p>
                                                                            <p className="text-gray-400">{log.at ? new Date(log.at).toLocaleString('en-IN') : ''}</p>
                                                                        </div>
                                                                        <span className="text-green-600 dark:text-green-400">Successful</span>
                                                                    </div>
                                                                ))}
                                                                {(!user.securityLog || user.securityLog.length === 0) && (
                                                                    <p className="text-gray-400">No recent security events.</p>
                                                                )}
                                                            </div>
                                                        </div>

                                                        {/* Investment Disclosure */}
                                                        <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 dark:bg-amber-900/20 dark:border-amber-700 space-y-1">
                                                            <p className="text-xs font-semibold uppercase tracking-wide text-amber-800 dark:text-amber-200">Investment Disclosure</p>
                                                            <p className="text-xs text-amber-900 dark:text-amber-100 leading-relaxed">
                                                                Target return: up to 2% per montha on invested capitl, subject to product terms and investment performance. Returns are not guaranteed. Past performance is not indicative of future results. Withdrawal processing may take up to 3 business days. Applicable taxes are the investor&apos;s responsibility.
                                                            </p>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <div>
                                            <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center dark:text-gray-200">
                                                <i className="fas fa-money-check-alt mr-2 text-blue-600"></i> Invest in AnkuOn2
                                            </h3>
                                            {user.kycStatus !== 'Verified' && (
                                                <div className="mb-4 p-4 bg-amber-50 border border-amber-300 rounded-xl dark:bg-amber-900/20 dark:border-amber-600">
                                                    <p className="text-sm font-semibold text-amber-900 dark:text-amber-200 flex items-center">
                                                        <i className="fas fa-exclamation-triangle mr-2"></i>
                                                        KYC required before investing
                                                    </p>
                                                    <p className="text-xs text-amber-800 dark:text-amber-300 mt-1">
                                                        Complete identity verification (PAN, Aadhaar, mobile OTP & bank) to unlock investments and withdrawals.
                                                    </p>
                                                    <button type="button" onClick={handleKycVerification}
                                                        className="mt-3 w-full p-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium btn-primary">
                                                        <i className="fas fa-id-badge mr-2"></i> Complete KYC Now
                                                    </button>
                                                </div>
                                            )}
                                            <form onSubmit={handleInvest} className="space-y-4">
                                                {/* Amount Input Box */}
                                                <div>
                                                    <label htmlFor="investmentAmount" className="block text-base font-medium text-gray-700 dark:text-gray-300 mb-1">Enter Investment Amount</label>
                                                    <input
                                                        id="investmentAmount"
                                                        type="text"
                                                        placeholder="Enter investment amount"
                                                        value={investmentAmount ? `₹${parseInt(investmentAmount.replace(/[^0-9]/g, '') || '0').toLocaleString('en-IN')}` : ''}
                                                        onChange={(e) => {
                                                            const raw = e.target.value.replace(/[^0-9]/g, '');
                                                            setInvestmentAmount(raw);
                                                            // Auto-switch payment method based on amount
                                                            const amt = parseInt(raw || '0');
                                                            if (amt > MAX_UPI_AMOUNT) {
                                                                setPaymentMethod('bank');
                                                            } else if (paymentMethod === 'bank') {
                                                                setPaymentMethod('qr');
                                                            }
                                                        }}
                                                        className="w-full p-4 text-lg border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                                        required
                                                        aria-required="true"
                                                    />
                                                    {/* Quick add buttons */}
                                                    <div className="flex flex-wrap gap-2 mt-3">
                                                        {[10000, 50000, 100000, 500000].map((add) => (
                                                            <button
                                                                key={add}
                                                                type="button"
                                                                onClick={() => {
                                                                    playSound(clickSound);
                                                                    const current = parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0');
                                                                    let next = current + add;
                                                                    if (next > MAX_INVEST_AMOUNT) next = MAX_INVEST_AMOUNT;
                                                                    setInvestmentAmount(String(next));
                                                                    if (next > MAX_UPI_AMOUNT) {
                                                                        setPaymentMethod('bank');
                                                                    } else if (paymentMethod === 'bank') {
                                                                        setPaymentMethod('qr');
                                                                    }
                                                                }}
                                                                className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-full text-sm font-medium btn-primary dark:bg-blue-900 dark:text-blue-300"
                                                            >
                                                                +₹{add >= 100000 ? (add / 100000) + 'L' : (add / 1000) + 'k'}
                                                            </button>
                                                        ))}
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                playSound(clickSound);
                                                                setInvestmentAmount('');
                                                                setPaymentMethod('qr');
                                                            }}
                                                            className="px-3 py-1.5 bg-gray-200 text-gray-700 rounded-full text-sm font-medium btn-primary dark:bg-gray-600 dark:text-gray-200"
                                                        >
                                                            Clear
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Payment Options – shown only after amount is entered */}
                                                {(() => {
                                                    const amt = parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0');
                                                    if (amt < MIN_INVEST_AMOUNT) return null;

                                                    // High value → Bank transfer only
                                                    if (amt > MAX_UPI_AMOUNT) {
                                                        return (
                                                            <div className="space-y-3">
                                                                <div className="p-3 bg-orange-50 border border-orange-300 rounded-lg text-sm text-orange-800 dark:bg-orange-900/30 dark:border-orange-600 dark:text-orange-200">
                                                                    <i className="fas fa-lock mr-2"></i>
                                                                    <strong>UPI / QR locked</strong> — amounts above ₹5 Lakh must use bank transfer.
                                                                </div>
                                                                <div
                                                                    className={`payment-method-box ${paymentMethod === 'bank' ? 'active' : ''} dark:border-gray-600`}
                                                                    onClick={() => { playSound(clickSound); setPaymentMethod('bank'); }}
                                                                >
                                                                    <div className="flex items-center mb-2">
                                                                        <i className="fas fa-university mr-2 text-blue-600 text-xl"></i>
                                                                        <input type="radio" id="bankMethod" name="paymentMethod" value="bank" checked={paymentMethod === 'bank'} onChange={() => setPaymentMethod('bank')} className="mr-2" />
                                                                        <label htmlFor="bankMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Net Banking / NEFT / RTGS / IMPS</label>
                                                                    </div>
                                                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                                                        High-value settlement via Net Banking, NEFT, RTGS or IMPS. Account details will be shared after confirmation.
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        );
                                                    }

                                                    // Normal range → QR + UPI
                                                    return (
                                                        <div className="space-y-3">
                                                            <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Choose payment method (UPI limit: ₹5 Lakh)</p>
                                                            <div
                                                                className={`payment-method-box ${paymentMethod === 'qr' ? 'active' : ''} dark:border-gray-600`}
                                                                onClick={() => { playSound(clickSound); setPaymentMethod('qr'); }}
                                                            >
                                                                <div className="flex items-center mb-1">
                                                                    <i className="fas fa-qrcode mr-2 text-blue-600 text-xl"></i>
                                                                    <input type="radio" id="qrMethod" name="paymentMethod" value="qr" checked={paymentMethod === 'qr'} onChange={() => setPaymentMethod('qr')} className="mr-2" />
                                                                    <label htmlFor="qrMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Pay with QR Code</label>
                                                                </div>
                                                                <p className="text-sm text-gray-600 dark:text-gray-400">Scan QR using any UPI app.</p>
                                                            </div>
                                                            <div
                                                                className={`payment-method-box ${paymentMethod === 'collect' ? 'active' : ''} dark:border-gray-600`}
                                                                onClick={() => { playSound(clickSound); setPaymentMethod('collect'); }}
                                                            >
                                                                <div className="flex items-center mb-1">
                                                                    <i className="fas fa-mobile-alt mr-2 text-blue-600 text-xl"></i>
                                                                    <input type="radio" id="collectMethod" name="paymentMethod" value="collect" checked={paymentMethod === 'collect'} onChange={() => setPaymentMethod('collect')} className="mr-2" />
                                                                    <label htmlFor="collectMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Pay with UPI Request</label>
                                                                </div>
                                                                <p className="text-sm text-gray-600 dark:text-gray-400">Approve request in your UPI app.</p>
                                                                {paymentMethod === 'collect' && (
                                                                    <div className="mt-3">
                                                                        <label htmlFor="userUpiIdForCollect" className="block text-sm font-medium text-gray-700 dark:text-gray-300">Your UPI ID</label>
                                                                        <input
                                                                            id="userUpiIdForCollect"
                                                                            type="text"
                                                                            placeholder="e.g., yourname@upi"
                                                                            value={userUpiIdForCollect}
                                                                            onChange={(e) => setUserUpiIdForCollect(e.target.value)}
                                                                            className={`w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white ${isUpiValid === true ? 'input-valid' : isUpiValid === false ? 'input-invalid' : 'border-gray-300 dark:border-gray-600'}`}
                                                                        />
                                                                        <p className="text-sm mt-1">
                                                                            {isUpiValid === true ? (
                                                                                <span className="text-green-600 flex items-center dark:text-green-400"><i className="fas fa-check-circle mr-1"></i> Valid UPI ID</span>
                                                                            ) : isUpiValid === false ? (
                                                                                <span className="text-red-600 flex items-center dark:text-red-400"><i className="fas fa-exclamation-circle mr-1"></i> Invalid UPI ID</span>
                                                                            ) : (
                                                                                <span className="text-gray-500 dark:text-gray-500">Enter your UPI ID</span>
                                                                            )}
                                                                        </p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })()}

                                                <button
                                                    type="submit"
                                                    className="w-full p-3 bg-blue-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                                    disabled={
                                                        loading ||
                                                        user.kycStatus !== 'Verified' ||
                                                        !investmentAmount ||
                                                        parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0') < MIN_INVEST_AMOUNT ||
                                                        parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0') > MAX_INVEST_AMOUNT ||
                                                        (paymentMethod === 'collect' && !isUpiValid)
                                                    }
                                                    aria-label="Proceed to payment"
                                                >
                                                    <i className="fas fa-arrow-right mr-2"></i> Proceed
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => { playSound(clickSound); setUser(null); localStorage.removeItem('user'); }}
                                        className="w-full p-3 bg-red-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                        disabled={loading}
                                        aria-label="Logout"
                                    >
                                        <i className="fas fa-sign-out-alt mr-2"></i> Logout
                                    </button>
                                </div>
                                <div className="bg-white p-6 sm:p-8 rounded-xl shadow-2xl fade-in dark:bg-gray-800">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 section-header flex items-center dark:text-gray-200" onClick={() => { playSound(clickSound); setShowInvestments(!showInvestments); }}>
                                        <i className="fas fa-chart-bar mr-2 text-blue-600"></i> Your Investments {showInvestments ? '▼' : '▶'}
                                    </h3>
                                    {showInvestments && (
                                        <InvestmentList
                                            user={user}
                                            handleWithdraw={handleWithdraw}
                                            handleCancelWithdrawal={handleCancelWithdrawal}
                                            selectedInvestmentId={selectedInvestmentId}
                                            setSelectedInvestmentId={setSelectedInvestmentId}
                                            showAllInvestments={showAllInvestments}
                                            setShowAllInvestments={setShowAllInvestments}
                                            loading={loading}
                                            playSound={playSound}
                                        />
                                    )}
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 section-header mt-6 flex items-center dark:text-gray-200" onClick={() => { playSound(clickSound); setShowWithdrawals(!showWithdrawals); }}>
                                        <i className="fas fa-hand-holding-usd mr-2 text-blue-600"></i> Withdrawal Requests {showWithdrawals ? '▼' : '▶'}
                                    </h3>
                                    {showWithdrawals && (
                                        <WithdrawalList
                                            user={user}
                                            showAllWithdrawals={showAllWithdrawals}
                                            setShowAllWithdrawals={setShowAllWithdrawals}
                                            playSound={playSound}
                                        />
                                    )}
                                    <Resources activeTab={activeTab} setActiveTab={setActiveTab} playSound={playSound} />
                                </div>
                            </div>
                        )}
                        <Modal
                            modal={modal}
                            setModal={setModal}
                            confirmPayment={confirmPayment}
                            confirmUpiCollect={confirmUpiCollect}
                            confirmWithdraw={confirmWithdraw}
                            confirmCancelWithdrawal={confirmCancelWithdrawal}
                            confirmUpdateProfile={confirmUpdateProfile}
                            confirmKycVerification={confirmKycVerification}
                            confirmBankTransfer={confirmBankTransfer}
                            confirmSensitiveAction={confirmSensitiveAction}
                            logoutAllDevices={logoutAllDevices}
                            loading={loading}
                            playSound={playSound}
                            kycStep={kycStep}
                            kycForm={kycForm}
                            setKycForm={setKycForm}
                            submitKycDetails={submitKycDetails}
                            verifyKycMobileOtp={verifyKycMobileOtp}
                            submitKycBank={submitKycBank}
                            kycMobileOtpSent={kycMobileOtpSent}
                            biometricStatus={biometricStatus}
                            biometricType={biometricType}
                            setBiometricType={setBiometricType}
                            startBiometricScan={startBiometricScan}
                            proceedAfterBiometric={proceedAfterBiometric}
                            sensitiveOtp={sensitiveOtp}
                            setSensitiveOtp={setSensitiveOtp}
                        />


                        <p className="text-sm text-gray-400 text-center mt-4">
                            Need assistance? Please contact the AnkuOn2 Support Team.
                        </p>



                        <footer className="mt-8 p-6 bg-gradient-to-r from-gray-800 to-gray-900 text-white w-full text-center rounded-t-xl shadow-lg dark:from-gray-700 dark:to-gray-800">
                            <p className="text-base">© 2005 AnkuOn2. All rights reserved. </p>
                            <p className="text-sm mt-2">Invest responsibly. Past performance is not indicative of future results. Terms and conditions apply.</p>
                        </footer>
                    </div>
                </ErrorBoundary>
            );
        };

        // Render the app
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
