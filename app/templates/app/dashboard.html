<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnkuOn2 – 2% monthly</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .btn-primary {
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .dark .modal-content {
            background: #1f2937;
            color: #f3f4f6;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 22px;
            border-radius: 10px;
            color: white;
            z-index: 1100;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .toast-success {
            background: #059669;
        }

        .toast-error {
            background: #dc2626;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .payment-box {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-box.active {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .dark .payment-box {
            border-color: #4b5563;
        }

        .dark .payment-box.active {
            border-color: #3b82f6;
            background: #1e3a5f;
        }

        .toggle {
            position: relative;
            width: 46px;
            height: 24px;
            display: inline-block;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #d1d5db;
            border-radius: 999px;
            transition: 0.3s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked+.slider {
            background: #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, memo } = React;
        const { createRoot } = ReactDOM;

        // ===================== CHANGE THIS =====================
        const API_BASE = "https://your-backend.com/api";
        // =======================================================

        const MIN_INVEST = 10000;
        const MAX_INVEST = 10000000;
        const MAX_UPI = 500000;

        // ---------- API helper ----------
        async function api(path, options = {}) {
            const token = localStorage.getItem("authToken");
            const res = await fetch(`${API_BASE}${path}`, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...options.headers,
                },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || `Request failed (${res.status})`);
            return data;
        }

        // ---------- helpers ----------
        const mask = {
            bank: (v) => (!v || v.length < 4 ? "****" : "****" + v.slice(-4)),
            pan: (v) => (!v || v.length < 6 ? "••••••••••" : v.slice(0, 3) + "••••" + v.slice(-1)),
            aadhaar: (v) => (!v || v.length < 4 ? "XXXX-XXXX-XXXX" : "XXXX-XXXX-" + v.slice(-4)),
            mobile: (v) => (!v || v.length < 4 ? "******" : "******" + v.slice(-4)),
        };

        // ---------- Toast ----------
        function useToast() {
            const [toast, setToast] = useState(null);
            const show = useCallback((message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 5500);
            }, []);
            return { toast, show };
        }

        // ===================== LOGIN =====================
        const LoginForm = memo(({ onSuccess, showToast }) => {
            const [form, setForm] = useState({ name: "", email: "", otp: "" });
            const [step, setStep] = useState("email"); // email | otp
            const [loading, setLoading] = useState(false);
            const [cooldown, setCooldown] = useState(0);

            useEffect(() => {
                if (cooldown <= 0) return;
                const t = setTimeout(() => setCooldown((c) => c - 1), 1000);
                return () => clearTimeout(t);
            }, [cooldown]);

            const sendOtp = async (e) => {
                e.preventDefault();
                const name = form.name.trim();
                const email = form.email.trim().toLowerCase();
                if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    return showToast("Enter valid name and email", "error");
                }
                setLoading(true);
                try {
                    await api("/auth/send-otp", {
                        method: "POST",
                        body: JSON.stringify({ name, email }),
                    });
                    setStep("otp");
                    setCooldown(60);
                    showToast("OTP sent to your email");
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const verifyOtp = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const data = await api("/auth/verify-otp", {
                        method: "POST",
                        body: JSON.stringify({
                            email: form.email.trim().toLowerCase(),
                            otp: form.otp.trim(),
                        }),
                    });
                    localStorage.setItem("authToken", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    onSuccess(data.user);
                    showToast("Login successful");
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 fade-in">
                    <div className="text-center mb-8">
                        <i className="fas fa-university text-blue-600 text-4xl mb-3"></i>
                        <h1 className="text-2xl font-bold text-gray-900 dark:text-white">AnkuOn2</h1>
                        <p className="text-sm text-gray-500 mt-1">Target up to 2% monthly</p>
                    </div>

                    {step === "email" ? (
                        <form onSubmit={sendOtp} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium mb-1 dark:text-gray-300">Full Name</label>
                                <input
                                    className="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="Your full name"
                                    value={form.name}
                                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                                    required
                                    autoFocus
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1 dark:text-gray-300">Email</label>
                                <input
                                    type="email"
                                    className="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="you@example.com"
                                    value={form.email}
                                    onChange={(e) => setForm({ ...form, email: e.target.value })}
                                    required
                                />
                            </div>
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl btn-primary disabled:opacity-50 flex items-center justify-center gap-2"
                            >
                                {loading ? <div className="spinner"></div> : <><i className="fas fa-paper-plane"></i> Send OTP</>}
                            </button>
                        </form>
                    ) : (
                        <form onSubmit={verifyOtp} className="space-y-4">
                            <p className="text-sm text-gray-600 dark:text-gray-400 text-center">
                                Enter the 6-digit OTP sent to<br /><strong>{form.email}</strong>
                            </p>
                            <input
                                className="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white text-center text-2xl tracking-[0.5em] focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="••••••"
                                maxLength="6"
                                value={form.otp}
                                onChange={(e) => setForm({ ...form, otp: e.target.value.replace(/\D/g, "") })}
                                required
                                autoFocus
                            />
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl btn-primary disabled:opacity-50 flex items-center justify-center gap-2"
                            >
                                {loading ? <div className="spinner"></div> : <><i className="fas fa-check"></i> Verify OTP</>}
                            </button>
                            <button
                                type="button"
                                disabled={cooldown > 0 || loading}
                                onClick={sendOtp}
                                className="w-full py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl disabled:opacity-50"
                            >
                                {cooldown > 0 ? `Resend in ${cooldown}s` : "Resend OTP"}
                            </button>
                            <button
                                type="button"
                                onClick={() => setStep("email")}
                                className="w-full py-2 text-sm text-gray-500 hover:text-gray-700"
                            >
                                ← Change email
                            </button>
                        </form>
                    )}
                </div>
            );
        });

        // ===================== MAIN APP =====================
        function App() {
            const [user, setUser] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem("user") || "null");
                } catch {
                    return null;
                }
            });
            const [loading, setLoading] = useState(false);
            const [dark, setDark] = useState(localStorage.getItem("dark") === "1");
            const [amount, setAmount] = useState("");
            const [method, setMethod] = useState("qr");
            const [upiId, setUpiId] = useState("");
            const [modal, setModal] = useState({ open: false, type: null, data: null });
            const [kycStep, setKycStep] = useState(1);
            const [kyc, setKyc] = useState({
                pan: "", aadhaar: "", mobile: "", otp: "",
                accountName: "", bankAccount: "", ifsc: ""
            });
            const { toast, show } = useToast();

            // dark mode
            useEffect(() => {
                document.documentElement.classList.toggle("dark", dark);
                localStorage.setItem("dark", dark ? "1" : "0");
            }, [dark]);

            // refresh user on load
            useEffect(() => {
                if (!user) return;
                api("/user/me")
                    .then((d) => {
                        setUser(d.user);
                        localStorage.setItem("user", JSON.stringify(d.user));
                    })
                    .catch(() => {
                        localStorage.removeItem("authToken");
                        localStorage.removeItem("user");
                        setUser(null);
                    });
            }, []);

            const logout = () => {
                localStorage.removeItem("authToken");
                localStorage.removeItem("user");
                setUser(null);
            };

            // ---------- KYC ----------
            const openKyc = () => {
                setKycStep(1);
                setKyc({ pan: "", aadhaar: "", mobile: "", otp: "", accountName: "", bankAccount: "", ifsc: "" });
                setModal({ open: true, type: "kyc" });
            };

            const kycIdentity = async () => {
                const pan = kyc.pan.trim().toUpperCase();
                const aadhaar = kyc.aadhaar.replace(/\s/g, "");
                const mobile = kyc.mobile.replace(/\s/g, "");
                if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) return show("Invalid PAN", "error");
                if (!/^\d{12}$/.test(aadhaar)) return show("Invalid Aadhaar", "error");
                if (!/^[6-9]\d{9}$/.test(mobile)) return show("Invalid mobile", "error");

                setLoading(true);
                try {
                    await api("/kyc/initiate", {
                        method: "POST",
                        body: JSON.stringify({ pan, aadhaar, mobile }),
                    });
                    setKycStep(2);
                    show("OTP sent to Aadhaar-linked mobile");
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const kycVerifyOtp = async () => {
                setLoading(true);
                try {
                    await api("/kyc/verify-otp", {
                        method: "POST",
                        body: JSON.stringify({ otp: kyc.otp }),
                    });
                    setKycStep(3);
                    show("Aadhaar verified");
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const kycComplete = async () => {
                if (!kyc.accountName.trim()) return show("Enter account holder name", "error");
                if (!/^\d{9,18}$/.test(kyc.bankAccount.replace(/\s/g, ""))) return show("Invalid account number", "error");
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(kyc.ifsc.trim().toUpperCase())) return show("Invalid IFSC", "error");

                setLoading(true);
                try {
                    const data = await api("/kyc/complete", {
                        method: "POST",
                        body: JSON.stringify({
                            accountName: kyc.accountName.trim(),
                            bankAccount: kyc.bankAccount.replace(/\s/g, ""),
                            ifsc: kyc.ifsc.trim().toUpperCase(),
                        }),
                    });
                    setUser(data.user);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setModal({ open: false });
                    show("KYC completed successfully");
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            // ---------- INVEST ----------
            const invest = async (e) => {
                e.preventDefault();
                const amt = parseInt(amount.replace(/\D/g, "") || "0", 10);
                if (amt < MIN_INVEST) return show(`Minimum ₹${MIN_INVEST.toLocaleString("en-IN")}`, "error");
                if (amt > MAX_INVEST) return show("Maximum ₹1 Crore", "error");
                if (user.kycStatus !== "Verified") return show("Complete KYC first", "error");
                if (amt > MAX_UPI && (method === "qr" || method === "collect")) {
                    return show("UPI/QR not allowed above ₹5 Lakh", "error");
                }
                if (method === "collect" && !upiId.includes("@")) {
                    return show("Enter valid UPI ID", "error");
                }

                setLoading(true);
                try {
                    const order = await api("/payments/create-order", {
                        method: "POST",
                        body: JSON.stringify({
                            amount: amt,
                            method,
                            upiId: method === "collect" ? upiId.trim() : undefined,
                        }),
                    });

                    if (method === "qr") {
                        setModal({ open: true, type: "qr", data: { qrData: order.qrData, amount: amt, orderId: order.orderId } });
                    } else if (method === "collect") {
                        setModal({ open: true, type: "collect", data: { amount: amt, orderId: order.orderId, upiId } });
                    } else {
                        setModal({ open: true, type: "bank", data: { amount: amt, orderId: order.orderId } });
                    }
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const confirmPay = async () => {
                setLoading(true);
                try {
                    const data = await api("/payments/confirm", {
                        method: "POST",
                        body: JSON.stringify({ orderId: modal.data.orderId }),
                    });
                    setUser(data.user);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    setModal({ open: false });
                    setAmount("");
                    show("Investment confirmed!");
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            // ---------- WITHDRAW ----------
            const withdraw = async (investmentId) => {
                if (user.kycStatus !== "Verified" || !user.kycData?.bankAccount) {
                    return show("Verified bank account required", "error");
                }
                setLoading(true);
                try {
                    const data = await api("/withdrawals/request", {
                        method: "POST",
                        body: JSON.stringify({ investmentId }),
                    });
                    setUser(data.user);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    show("Withdrawal requested. Processing in 3 business days.");
                } catch (e) {
                    show(e.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            // ---------- RENDER ----------
            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800">
                        <LoginForm onSuccess={setUser} showToast={show} />
                        {toast && (
                            <div className={`toast ${toast.type === "error" ? "toast-error" : "toast-success"}`}>
                                {toast.message}
                            </div>
                        )}
                    </div>
                );
            }

            const totalInvested = (user.investments || []).reduce((s, i) => s + (i.amount || 0), 0);
            const totalReturns = (user.investments || []).reduce((s, i) => s + (i.returns || 0), 0);
            const amtNum = parseInt(amount.replace(/\D/g, "") || "0", 10);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 pb-12">
                    {/* Header */}
                    <header className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <i className="fas fa-university text-blue-600 text-2xl"></i>
                                <div>
                                    <h1 className="font-bold text-lg text-gray-900 dark:text-white">AnkuOn2</h1>
                                    <p className="text-xs text-gray-500">2% monthly target</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <label className="toggle">
                                    <input type="checkbox" checked={dark} onChange={() => setDark(!dark)} />
                                    <span className="slider"></span>
                                </label>
                                <button onClick={logout} className="text-sm text-red-600 hover:underline">
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 py-8 space-y-6">
                        {/* Welcome + Portfolio */}
                        <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                                <div>
                                    <h2 className="text-xl font-semibold text-gray-900 dark:text-white">Welcome, {user.name}</h2>
                                    <p className="text-sm text-gray-500 mt-0.5">
                                        KYC: <span className={user.kycStatus === "Verified" ? "text-green-600 font-medium" : "text-amber-600"}>{user.kycStatus}</span>
                                    </p>
                                </div>
                                {user.kycStatus !== "Verified" && (
                                    <button onClick={openKyc} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium btn-primary">
                                        <i className="fas fa-id-badge mr-2"></i>Complete KYC
                                    </button>
                                )}
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="p-5 bg-blue-50 dark:bg-blue-900/30 rounded-xl">
                                    <p className="text-sm text-gray-600 dark:text-gray-300">Total Invested</p>
                                    <p className="text-2xl font-bold text-blue-600 mt-1">₹{totalInvested.toLocaleString("en-IN")}</p>
                                </div>
                                <div className="p-5 bg-green-50 dark:bg-green-900/30 rounded-xl">
                                    <p className="text-sm text-gray-600 dark:text-gray-300">Total Returns</p>
                                    <p className="text-2xl font-bold text-green-600 mt-1">₹{totalReturns.toLocaleString("en-IN")}</p>
                                </div>
                            </div>
                        </div>

                        {/* Invest */}
                        <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6">
                            <h3 className="text-lg font-semibold mb-4 text-gray-900 dark:text-white">
                                <i className="fas fa-money-check-alt text-blue-600 mr-2"></i>Invest
                            </h3>

                            {user.kycStatus !== "Verified" && (
                                <div className="mb-5 p-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 rounded-xl">
                                    <p className="text-sm font-medium text-amber-800 dark:text-amber-200">KYC required before investing</p>
                                    <button onClick={openKyc} className="mt-2 text-sm text-blue-600 font-medium hover:underline">
                                        Complete KYC now →
                                    </button>
                                </div>
                            )}

                            <form onSubmit={invest} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-medium mb-1.5 dark:text-gray-300">Investment Amount</label>
                                    <input
                                        className="w-full px-4 py-3.5 text-lg rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                        placeholder="₹10,000 minimum"
                                        value={amount ? `₹${amtNum.toLocaleString("en-IN")}` : ""}
                                        onChange={(e) => {
                                            const raw = e.target.value.replace(/\D/g, "");
                                            setAmount(raw);
                                            if (parseInt(raw || "0") > MAX_UPI) setMethod("bank");
                                        }}
                                    />
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        {[10000, 50000, 100000, 500000].map((v) => (
                                            <button
                                                key={v}
                                                type="button"
                                                onClick={() => {
                                                    const next = Math.min(MAX_INVEST, amtNum + v);
                                                    setAmount(String(next));
                                                    if (next > MAX_UPI) setMethod("bank");
                                                }}
                                                className="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 rounded-full text-sm font-medium"
                                            >
                                                +₹{v >= 100000 ? v / 100000 + "L" : v / 1000 + "k"}
                                            </button>
                                        ))}
                                        <button type="button" onClick={() => { setAmount(""); setMethod("qr"); }}
                                            className="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-full text-sm">
                                            Clear
                                        </button>
                                    </div>
                                </div>

                                {amtNum >= MIN_INVEST && (
                                    <div className="space-y-3">
                                        <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Payment method</p>

                                        {amtNum > MAX_UPI ? (
                                            <div className="p-3 bg-orange-50 dark:bg-orange-900/20 border border-orange-200 dark:border-orange-700 rounded-xl text-sm text-orange-800 dark:text-orange-200">
                                                <i className="fas fa-lock mr-2"></i>UPI/QR locked above ₹5 Lakh — use bank transfer
                                            </div>
                                        ) : (
                                            <>
                                                <div className={`payment-box ${method === "qr" ? "active" : ""}`} onClick={() => setMethod("qr")}>
                                                    <div className="flex items-center gap-3">
                                                        <i className="fas fa-qrcode text-blue-600 text-xl"></i>
                                                        <div>
                                                            <p className="font-medium dark:text-white">Pay with QR Code</p>
                                                            <p className="text-xs text-gray-500">Scan with any UPI app</p>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className={`payment-box ${method === "collect" ? "active" : ""}`} onClick={() => setMethod("collect")}>
                                                    <div className="flex items-center gap-3">
                                                        <i className="fas fa-mobile-alt text-blue-600 text-xl"></i>
                                                        <div>
                                                            <p className="font-medium dark:text-white">UPI Collect Request</p>
                                                            <p className="text-xs text-gray-500">Approve in your UPI app</p>
                                                        </div>
                                                    </div>
                                                    {method === "collect" && (
                                                        <input
                                                            className="mt-3 w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white text-sm"
                                                            placeholder="yourname@upi"
                                                            value={upiId}
                                                            onChange={(e) => setUpiId(e.target.value)}
                                                            onClick={(e) => e.stopPropagation()}
                                                        />
                                                    )}
                                                </div>
                                            </>
                                        )}

                                        <div className={`payment-box ${method === "bank" ? "active" : ""}`} onClick={() => setMethod("bank")}>
                                            <div className="flex items-center gap-3">
                                                <i className="fas fa-university text-blue-600 text-xl"></i>
                                                <div>
                                                    <p className="font-medium dark:text-white">Net Banking / NEFT / RTGS</p>
                                                    <p className="text-xs text-gray-500">For high-value transfers</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    disabled={loading || user.kycStatus !== "Verified" || amtNum < MIN_INVEST}
                                    className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl btn-primary disabled:opacity-50 flex items-center justify-center gap-2"
                                >
                                    {loading ? <div className="spinner"></div> : <><i className="fas fa-arrow-right"></i> Proceed</>}
                                </button>
                            </form>
                        </div>

                        {/* Investments list */}
                        <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6">
                            <h3 className="text-lg font-semibold mb-4 text-gray-900 dark:text-white">
                                <i className="fas fa-chart-bar text-blue-600 mr-2"></i>Your Investments
                            </h3>
                            {(user.investments || []).length === 0 ? (
                                <p className="text-gray-500 text-sm">No investments yet</p>
                            ) : (
                                <ul className="space-y-3">
                                    {(user.investments || []).map((inv) => (
                                        <li key={inv.id} className="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p className="font-medium dark:text-white">₹{inv.amount.toLocaleString("en-IN")}</p>
                                                <p className="text-sm text-gray-500">
                                                    Returns: ₹{(inv.returns || 0).toLocaleString("en-IN")} · {new Date(inv.date).toLocaleDateString("en-IN")}
                                                </p>
                                                <p className="text-xs mt-1">
                                                    <span className={`px-2 py-0.5 rounded-full ${inv.status === "Confirmed" ? "bg-green-100 text-green-700" : "bg-gray-200 text-gray-600"}`}>
                                                        {inv.status}
                                                    </span>
                                                </p>
                                            </div>
                                            {inv.status === "Confirmed" && (
                                                <button
                                                    onClick={() => withdraw(inv.id)}
                                                    disabled={loading}
                                                    className="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white text-sm rounded-lg disabled:opacity-50"
                                                >
                                                    Withdraw
                                                </button>
                                            )}
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>

                        {/* Bank info if verified */}
                        {user.kycData?.bankAccount && (
                            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6">
                                <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Primary Payout Account</h3>
                                <p className="dark:text-white">{mask.bank(user.kycData.bankAccount)}</p>
                                <p className="text-sm text-gray-500">{user.kycData.accountName} · {user.kycData.ifsc}</p>
                            </div>
                        )}
                    </main>

                    {/* ========== MODALS ========== */}
                    {modal.open && (
                        <div className="modal-overlay fade-in">
                            <div className="modal-content">
                                <button
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"
                                    onClick={() => setModal({ open: false })}
                                >
                                    ×
                                </button>

                                {/* KYC Modal */}
                                {modal.type === "kyc" && (
                                    <>
                                        <h3 className="text-xl font-semibold mb-1 dark:text-white">KYC Verification</h3>
                                        <p className="text-sm text-gray-500 mb-6">Step {kycStep} of 3</p>

                                        {kycStep === 1 && (
                                            <div className="space-y-4">
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="PAN (ABCDE1234F)" maxLength="10"
                                                    value={kyc.pan} onChange={(e) => setKyc({ ...kyc, pan: e.target.value.toUpperCase() })} />
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="Aadhaar (12 digits)" maxLength="12"
                                                    value={kyc.aadhaar} onChange={(e) => setKyc({ ...kyc, aadhaar: e.target.value.replace(/\D/g, "") })} />
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="Mobile linked to Aadhaar" maxLength="10"
                                                    value={kyc.mobile} onChange={(e) => setKyc({ ...kyc, mobile: e.target.value.replace(/\D/g, "") })} />
                                                <button onClick={kycIdentity} disabled={loading}
                                                    className="w-full py-3 bg-blue-600 text-white rounded-xl font-medium disabled:opacity-50 flex justify-center">
                                                    {loading ? <div className="spinner"></div> : "Send OTP"}
                                                </button>
                                            </div>
                                        )}

                                        {kycStep === 2 && (
                                            <div className="space-y-4">
                                                <p className="text-sm text-gray-600 dark:text-gray-300">
                                                    OTP sent to <strong>+91 {kyc.mobile}</strong>
                                                </p>
                                                <input className="w-full px-4 py-3 rounded-xl border text-center text-xl tracking-widest dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="••••••" maxLength="6"
                                                    value={kyc.otp} onChange={(e) => setKyc({ ...kyc, otp: e.target.value.replace(/\D/g, "") })} />
                                                <button onClick={kycVerifyOtp} disabled={loading}
                                                    className="w-full py-3 bg-blue-600 text-white rounded-xl font-medium disabled:opacity-50 flex justify-center">
                                                    {loading ? <div className="spinner"></div> : "Verify OTP"}
                                                </button>
                                            </div>
                                        )}

                                        {kycStep === 3 && (
                                            <div className="space-y-4">
                                                <p className="text-sm text-gray-600 dark:text-gray-300 mb-2">Link bank account for payouts</p>
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="Account Holder Name"
                                                    value={kyc.accountName} onChange={(e) => setKyc({ ...kyc, accountName: e.target.value })} />
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="Bank Account Number"
                                                    value={kyc.bankAccount} onChange={(e) => setKyc({ ...kyc, bankAccount: e.target.value.replace(/\D/g, "") })} />
                                                <input className="w-full px-4 py-3 rounded-xl border dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                                    placeholder="IFSC Code" maxLength="11"
                                                    value={kyc.ifsc} onChange={(e) => setKyc({ ...kyc, ifsc: e.target.value.toUpperCase() })} />
                                                <button onClick={kycComplete} disabled={loading}
                                                    className="w-full py-3 bg-blue-600 text-white rounded-xl font-medium disabled:opacity-50 flex justify-center">
                                                    {loading ? <div className="spinner"></div> : "Complete KYC"}
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}

                                {/* Payment Modals */}
                                {(modal.type === "qr" || modal.type === "collect" || modal.type === "bank") && (
                                    <>
                                        <h3 className="text-xl font-semibold mb-4 dark:text-white">
                                            {modal.type === "qr" ? "Scan QR to Pay" : modal.type === "collect" ? "Approve UPI Request" : "Bank Transfer"}
                                        </h3>
                                        <p className="text-lg font-medium mb-4 dark:text-white">
                                            ₹{modal.data.amount.toLocaleString("en-IN")}
                                        </p>

                                        {modal.type === "qr" && (
                                            <img
                                                src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(modal.data.qrData)}`}
                                                alt="Payment QR"
                                                className="mx-auto mb-4 rounded-lg border-4 border-gray-100"
                                            />
                                        )}

                                        {modal.type === "collect" && (
                                            <p className="text-sm text-gray-600 dark:text-gray-300 mb-4">
                                                Open your UPI app and approve the request sent to <strong>{modal.data.upiId}</strong>
                                            </p>
                                        )}

                                        {modal.type === "bank" && (
                                            <div className="p-4 bg-blue-50 dark:bg-blue-900/30 rounded-xl text-sm mb-4">
                                                <p className="font-medium mb-1">Next steps:</p>
                                                <ol className="list-decimal list-inside space-y-1 text-gray-700 dark:text-gray-300">
                                                    <li>Bank details will be shared shortly</li>
                                                    <li>Complete NEFT / RTGS / IMPS transfer</li>
                                                    <li>Investment confirms after funds received (T+1)</li>
                                                </ol>
                                            </div>
                                        )}

                                        <p className="text-xs text-gray-400 mb-5">Order ID: {modal.data.orderId}</p>

                                        <button
                                            onClick={confirmPay}
                                            disabled={loading}
                                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl disabled:opacity-50 flex items-center justify-center gap-2"
                                        >
                                            {loading ? <div className="spinner"></div> : "I have paid – Confirm"}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Toast */}
                    {toast && (
                        <div className={`toast ${toast.type === "error" ? "toast-error" : "toast-success"} fade-in`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
