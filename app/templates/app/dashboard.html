<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkuOn2 – 2% monthly</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/payments.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .btn-primary {
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .tab {
            border-bottom: 2px solid transparent;
        }

        .tab-active {
            border-bottom: 2px solid #2563eb;
            color: #2563eb;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 90%;
            width: 500px;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .modal-content.hidden {
            transform: scale(0.95);
            opacity: 0;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            cursor: pointer;
            font-size: 20px;
            color: #4b5563;
        }

        .modal-close:hover {
            color: #2563eb;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 90%;
            width: 400px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.hidden {
            transform: translateY(20px);
            opacity: 0;
        }

        .toast-error {
            background: #ef4444;
        }

        .toast-close {
            cursor: pointer;
            margin-left: 16px;
            font-size: 16px;
        }

        .toast-close:hover {
            color: #e5e7eb;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 16px auto;
            border: 4px solid #f3f3f3;
            border-radius: 8px;
            display: block;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            background: #f3f3f3;
            padding: 8px;
            border-radius: 8px;
        }

        .progress-step {
            flex: 1;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            padding: 8px;
            border-radius: 4px;
            margin: 0 4px;
        }

        .progress-step.active {
            background: #2563eb;
            color: white;
        }

        .section-header {
            cursor: pointer;
        }

        .payment-method-box {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .payment-method-box.active {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .payment-method-box:hover {
            border-color: #2563eb;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .tooltip {
            position: relative;
        }

        .tooltip:hover:after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }

        .input-valid {
            border-color: #10b981 !important;
        }

        .input-invalid {
            border-color: #ef4444 !important;
        }

        /* Dark mode styles */
        .dark body {
            background-color: #1f2937;
            color: #f3f4f6;
        }

        .dark .bg-white {
            background-color: #374151;
        }

        .dark .bg-gray-50 {
            background-color: #4b5563;
        }

        .dark .bg-gray-100 {
            background-color: #4b5563;
        }

        .dark .text-gray-800 {
            color: #d1d5db;
        }

        .dark .text-gray-700 {
            color: #d1d5db;
        }

        .dark .text-gray-600 {
            color: #9ca3af;
        }

        .dark .text-gray-500 {
            color: #9ca3af;
        }

        .dark .border-gray-300 {
            border-color: #6b7280;
        }

        .dark .border-gray-200 {
            border-color: #4b5563;
        }

        .dark .modal-content {
            background: #374151;
            color: #f3f4f6;
        }

        .dark .payment-method-box {
            border-color: #6b7280;
        }

        .dark .payment-method-box.active {
            border-color: #3b82f6;
            background: #1e3a5f;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, memo } = React;
        const { createRoot } = ReactDOM;

        // Constants
        const MIN_INVEST_AMOUNT = 10000;      // ₹10,000 minimum
        const MAX_INVEST_AMOUNT = 10000000;   // ₹1 Crore maximum
        const MAX_UPI_AMOUNT = 500000;        // ₹5 Lakh – UPI/QR not allowed above this
        const MONTHLY_RETURN_RATE = 0.02;
        const OTP_RESEND_COOLDOWN = 60;
        const WITHDRAWAL_CANCELLATION_WINDOW_MS = 2 * 24 * 60 * 60 * 1000; // 2 days
        const WITHDRAWAL_PROCESSING_DAYS = 3;

        // Pure helper – safe to call from any component
        const isWithdrawalCancellable = (requestedDate) => {
            return Date.now() - new Date(requestedDate).getTime() < WITHDRAWAL_CANCELLATION_WINDOW_MS;
        };

        // Error Boundary Component
        class ErrorBoundary extends React.Component {
            state = { error: null };
            static getDerivedStateFromError(error) {
                return { error: error.message };
            }
            render() {
                if (this.state.error) {
                    return (
                        <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">
                            <h1 className="text-4xl font-extrabold text-red-600 mb-8">Something Went Wrong</h1>
                            <div className="mb-6 p-6 bg-red-100 text-red-800 rounded-lg shadow-lg max-w-md text-center">
                                <p>{this.state.error}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-4 p-2 bg-blue-600 text-white rounded-lg btn-primary"
                                >
                                    Retry
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ============================================================
        // MOCK BACKEND (simulates secure server-side storage)
        // In production this would be a real encrypted database + API.
        // All user records, investments, withdrawals and audit logs
        // are persisted so data survives page refresh / browser close.
        // ============================================================
        const loadMockUsers = () => {
            try {
                const stored = localStorage.getItem('ankuon_users_v2');
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                console.error('Backend load error:', e);
                return {};
            }
        };

        const saveMockUsers = (users) => {
            try {
                localStorage.setItem('ankuon_users_v2', JSON.stringify(users));
            } catch (e) {
                console.error('Backend save error:', e);
            }
        };

        let mockUsers = loadMockUsers();

        // Masking helpers (security — show minimal info)
        const maskUpi = (upi) => {
            if (!upi || upi.length < 5) return upi || '—';
            const [name, handle] = upi.split('@');
            if (!handle) return '••••••';
            const maskedName = name.length <= 2 ? '••' : name.slice(0, 2) + '••••';
            return `${maskedName}@${handle}`;
        };
        const maskPan = (pan) => {
            if (!pan || pan.length < 6) return '••••••••••';
            return pan.slice(0, 3) + '••••' + pan.slice(-1);
        };
        const maskAadhaar = (aadhaar) => {
            if (!aadhaar || aadhaar.length < 4) return 'XXXX-XXXX-XXXX';
            return 'XXXX-XXXX-' + aadhaar.slice(-4);
        };
        const maskMobile = (mobile) => {
            if (!mobile || mobile.length < 4) return '******';
            return '******' + mobile.slice(-4);
        };
        const maskBank = (acc) => {
            if (!acc || acc.length < 4) return '****';
            return '****' + acc.slice(-4);
        };

        // Mock resources data
        const resourcesData = {
            information: [
                { id: 1, title: 'Platform Update', content: 'Seamless settlement via UPI, QR, and high-value bank transfers (NEFT / RTGS / IMPS) for all client allocations.' },
                { id: 2, title: 'Investment Philosophy', content: 'Disciplined capital deployment, transparent monthly returns, and institutional-grade reporting for every client.' },
                { id: 3, title: 'Client Focus', content: 'Serving individual and institutional investors with secure, compliant investment solutions.' },
            ],
            notes: [
                { id: 1, content: 'UPI and QR payments are available up to ₹5 Lakh. Higher amounts are processed via NEFT / RTGS / IMPS.' },
                { id: 2, content: 'All withdrawals are paid only to your verified bank account via NEFT / RTGS / IMPS.' },
                { id: 3, content: 'KYC verification is mandatory before investing or requesting a withdrawal.' },
            ],
            quotes: [
                { id: 1, content: '"In investing, what is comfortable is rarely profitable." – Robert Arnott' },
                { id: 2, content: '"The stock market is a device for transferring money from the impatient to the patient." – Warren Buffett' },
                { id: 3, content: '"Risk comes from not knowing what you are doing." – Warren Buffett' },
            ],
        };

        // Sound effects
        const clickSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/click.wav');
        clickSound.volume = 0.5;
        clickSound.preload = 'auto';
        const notificationSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/notification.wav');
        notificationSound.volume = 0.5;
        notificationSound.preload = 'auto';
        const depositSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/deposit.wav');
        depositSound.volume = 0.5;
        depositSound.preload = 'auto';

        // Debounce utility
        const useDebounce = (value, delay) => {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        };

        // Sanitize input utility
        const sanitizeInput = (input) => input.replace(/[<>&'"]/g, '');

        // Clock Component
        const Clock = memo(() => {
            const [currentTime, setCurrentTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 10000); // Update every 10 seconds
                return () => clearInterval(timer);
            }, []);
            const formatDateTime = (date) => new Intl.DateTimeFormat('en-IN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                timeZone: 'Asia/Kolkata',
                timeZoneName: 'short',
            }).format(date);
            return <p className="text-gray-600 text-base dark:text-gray-400">{formatDateTime(currentTime)}</p>;
        });

        // Login Form Component
        const LoginForm = memo(({ setUser, setMessage, setLoading, loading, isSoundEnabled, playSound }) => {
            const [formState, setFormState] = useState({ email: '', name: '', otp: '' });
            const [otpSent, setOtpSent] = useState(false);
            const [resendCooldown, setResendCooldown] = useState(0);

            useEffect(() => {
                if (otpSent && resendCooldown > 0) {
                    const timer = setTimeout(() => setResendCooldown(resendCooldown - 1), 1000);
                    return () => clearTimeout(timer);
                }
            }, [otpSent, resendCooldown]);

            const sendOtp = useCallback((e) => {
                e.preventDefault();
                playSound(clickSound);
                let { email, name } = formState;
                const trimmedEmail = sanitizeInput(email.trim());
                const trimmedName = sanitizeInput(name.trim());
                if (!trimmedEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmedEmail)) {
                    setMessage('Please enter a valid email address.');
                    return;
                }
                if (!trimmedName) {
                    setMessage('Please enter your full name.');
                    return;
                }
                setLoading(true);
                const generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
                mockUsers[trimmedEmail] = mockUsers[trimmedEmail] || {
                    name: trimmedName,
                    otp: null,
                    verified: false,
                    investments: [],
                    withdrawals: [],
                    upiId: '',
                    kycStatus: 'Not Verified',
                    createdAt: new Date().toISOString(),
                    lastLogin: null,
                    lastProfileUpdate: null,
                    securityLog: [],
                    twoFactorEnabled: false,
                    activeSessions: 1,
                };
                mockUsers[trimmedEmail].otp = generatedOtp;
                mockUsers[trimmedEmail].name = trimmedName;
                saveMockUsers(mockUsers);
                setTimeout(() => {
                    setOtpSent(true);
                    setResendCooldown(OTP_RESEND_COOLDOWN);
                    // Demo only: log OTP to console instead of exposing it in the UI
                    console.log(`[DEMO] OTP for ${trimmedEmail}: ${generatedOtp}`);
                    setMessage(`OTP sent to ${trimmedEmail}. Check the browser console for the demo OTP.`);
                    setLoading(false);
                    playSound(notificationSound);
                }, 1000);
            }, [formState, setMessage, setLoading, playSound]);

            const verifyOtp = useCallback((e) => {
                e.preventDefault();
                playSound(clickSound);
                const { email, otp } = formState;
                const trimmedEmail = sanitizeInput(email.trim());
                if (!mockUsers[trimmedEmail] || mockUsers[trimmedEmail].otp !== otp) {
                    setMessage('Invalid OTP. Please try again.');
                    return;
                }
                setLoading(true);
                setTimeout(() => {
                    mockUsers[trimmedEmail].verified = true;
                    mockUsers[trimmedEmail].lastLogin = new Date().toISOString();
                    mockUsers[trimmedEmail].otp = null; // clear OTP after use
                    if (!mockUsers[trimmedEmail].securityLog) mockUsers[trimmedEmail].securityLog = [];
                    mockUsers[trimmedEmail].securityLog.push({ action: 'LOGIN', at: new Date().toISOString() });
                    saveMockUsers(mockUsers);
                    const userData = { email: trimmedEmail, ...mockUsers[trimmedEmail] };
                    setUser(userData);
                    localStorage.setItem('user', JSON.stringify(userData));
                    setOtpSent(false);
                    setFormState({ email: '', name: '', otp: '' });
                    setMessage('Login successful! Welcome to AnkuOn2.');
                    setLoading(false);
                    playSound(notificationSound);
                }, 1000);
            }, [formState, setUser, setMessage, setLoading, playSound]);

            return (
                <div className="w-full max-w-md bg-white p-6 sm:p-8 rounded-xl shadow-2xl fade-in dark:bg-gray-800">
                    <h2 className="text-xl sm:text-2xl font-semibold text-gray-800 mb-6 dark:text-gray-200">{otpSent ? 'Enter OTP' : 'Login / Register'}</h2>
                    {!otpSent ? (
                        <form onSubmit={sendOtp} className="space-y-4">
                            <div>
                                <label htmlFor="name" className="block text-base font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                                <input
                                    id="name"
                                    type="text"
                                    placeholder="Enter your full name"
                                    value={formState.name}
                                    onChange={(e) => setFormState(prev => ({ ...prev, name: e.target.value }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required
                                    autoFocus
                                    aria-required="true"
                                />
                            </div>
                            <div>
                                <label htmlFor="email" className="block text-base font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                                <input
                                    id="email"
                                    type="email"
                                    placeholder="Enter your email"
                                    value={formState.email}
                                    onChange={(e) => setFormState(prev => ({ ...prev, email: e.target.value }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required
                                    aria-required="true"
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full p-3 bg-blue-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                disabled={loading}
                                aria-label="Send OTP"
                            >
                                <i className="fas fa-paper-plane mr-2"></i> Send OTP
                            </button>
                        </form>
                    ) : (
                        <form onSubmit={verifyOtp} className="space-y-4">
                            <div>
                                <label htmlFor="otp" className="block text-base font-medium text-gray-700 dark:text-gray-300">OTP</label>
                                <input
                                    id="otp"
                                    type="text"
                                    placeholder="Enter 6-digit OTP"
                                    value={formState.otp}
                                    onChange={(e) => setFormState(prev => ({ ...prev, otp: e.target.value }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required
                                    maxLength="6"
                                    autoFocus
                                    aria-required="true"
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full p-3 bg-blue-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                disabled={loading}
                                aria-label="Verify OTP"
                            >
                                <i className="fas fa-check mr-2"></i> Verify OTP
                            </button>
                            <button
                                type="button"
                                onClick={sendOtp}
                                className="w-full p-3 bg-green-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                disabled={resendCooldown > 0 || loading}
                                aria-label="Resend OTP"
                            >
                                <i className="fas fa-redo mr-2"></i> {resendCooldown > 0 ? `Resend in ${resendCooldown}s` : 'Resend OTP'}
                            </button>
                            <button
                                onClick={() => { playSound(clickSound); setOtpSent(false); setMessage(''); }}
                                className="w-full p-3 bg-gray-500 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                disabled={loading}
                                aria-label="Go back"
                            >
                                <i className="fas fa-arrow-left mr-2"></i> Back
                            </button>
                        </form>
                    )}
                </div>
            );
        });

        // Resources Component
        const Resources = memo(({ activeTab, setActiveTab, playSound }) => (
            <div className="mt-6">
                <h3 className="text-xl font-semibold text-gray-800 mb-3 flex items-center dark:text-gray-200">
                    <i className="fas fa-info-circle mr-2 text-blue-600"></i> Resources
                </h3>
                <div className="flex mb-4 border-b border-gray-200 dark:border-gray-600">
                    {['information', 'notes', 'quotes'].map((tab) => (
                        <button
                            key={tab}
                            onClick={() => { playSound(clickSound); setActiveTab(tab); }}
                            className={`flex-1 p-3 text-gray-700 font-medium text-base dark:text-gray-300 ${activeTab === tab ? 'tab-active' : 'tab'}`}
                            aria-label={`View ${tab}`}
                        >
                            {tab.charAt(0).toUpperCase() + tab.slice(1)}
                        </button>
                    ))}
                </div>
                <div className="p-4 bg-gray-50 rounded-lg shadow-sm dark:bg-gray-700">
                    {resourcesData[activeTab].length === 0 ? (
                        <p className="text-gray-600 text-base dark:text-gray-400">No {activeTab} available.</p>
                    ) : (
                        <ul className="space-y-3">
                            {resourcesData[activeTab].map((item) => (
                                <li key={item.id} className="text-gray-800 text-base dark:text-gray-200">
                                    {item.title ? <strong>{item.title}: </strong> : null}
                                    {item.content}
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            </div>
        ));

        // Dashboard Component
        const Dashboard = memo(({ user }) => {
            const calculateTotalInvestments = useMemo(() => {
                if (!user || user.investments.length === 0) return { total: 0, returns: 0 };
                const activeInvestments = user.investments.filter(
                    (inv) => !user.withdrawals.some((wd) => wd.investmentId === inv.id && wd.status === 'Completed')
                );
                const total = activeInvestments.reduce((sum, inv) => sum + inv.amount, 0);
                const returns = activeInvestments.reduce((sum, inv) => sum + inv.returns, 0);
                return { total, returns };
            }, [user]);

            return (
                <div className="mb-6 p-6 bg-gradient-to-r from-blue-50 to-blue-100 rounded-lg shadow-md dark:from-gray-800 dark:to-gray-900">
                    <h3 className="text-xl font-semibold text-gray-800 mb-4 flex items-center dark:text-gray-200">
                        <i className="fas fa-chart-pie mr-2 text-blue-600"></i> Portfolio Summary
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="p-4 bg-white rounded-lg shadow-sm flex items-center dark:bg-gray-700">
                            <i className="fas fa-rupee-sign text-blue-600 mr-3 text-xl"></i>
                            <div>
                                <p className="text-gray-600 dark:text-gray-400">Total Invested</p>

                setUpiOtpSent(false);
            }, [playSound]);

            const sendUpiVerifyOtp = useCallback(() => {
                playSound(clickSound);
                const trimmed = sanitizeInput(pendingUpi.trim());
                if (!/^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/.test(trimmed)) {
                    showToast('Enter a valid UPI ID (e.g. name@upi).', 'error');
                    return;
                }
                // Demo OTP fixed — never shown as plain text on the page; production would SMS/email it
                setUpiGeneratedOtp('123456');
                setUpiOtpSent(true);
                setShowUpiChange(true);
                showToast('Verification OTP sent to your registered mobile / email.', 'success');
            }, [pendingUpi, playSound, showToast]);

            const confirmUpiChange = useCallback(() => {
                playSound(clickSound);
                if (upiVerifyOtp !== upiGeneratedOtp) {
                    showToast('Invalid OTP. Try again.', 'error');
                    return;
                }
                const trimmed = sanitizeInput(pendingUpi.trim());
                mockUsers[user.email].upiId = trimmed;
                mockUsers[user.email].lastProfileUpdate = new Date().toISOString();
                if (!mockUsers[user.email].securityLog) mockUsers[user.email].securityLog = [];
                mockUsers[user.email].securityLog.push({ action: 'UPI_UPDATED', at: new Date().toISOString(), detail: maskUpi(trimmed) });
                saveMockUsers(mockUsers);
                const updated = { ...user, upiId: trimmed, lastProfileUpdate: mockUsers[user.email].lastProfileUpdate };
                setUser(updated);
                localStorage.setItem('user', JSON.stringify(updated));
                setShowUpiChange(false);
                setPendingUpi('');
                setUpiOtpSent(false);
                setUpiVerifyOtp('');
                setUpiGeneratedOtp(''); // clear OTP from memory
                showToast('UPI verified successfully. Payout UPI updated.', 'success');
                playSound(notificationSound);
            }, [upiVerifyOtp, upiGeneratedOtp, pendingUpi, user, playSound, showToast]);

            const confirmSensitiveAction = useCallback(() => {
                playSound(clickSound);
                if (sensitiveOtp !== sensitiveGeneratedOtp) {
                    showToast('Invalid verification code.', 'error');
                    return;
                }
                if (sensitiveAction === 'disable2fa') {
                    mockUsers[user.email].twoFactorEnabled = false;
                    mockUsers[user.email].securityLog.push({ action: '2FA_DISABLED', at: new Date().toISOString() });
                    saveMockUsers(mockUsers);
                    const updated = { ...user, twoFactorEnabled: false };
                    setUser(updated);
                    localStorage.setItem('user', JSON.stringify(updated));
                    showToast('Two-factor authentication disabled.', 'success');
                } else if (sensitiveAction === 'upi' && modal.data?.pendingUpi) {
                    setPendingUpi(modal.data.pendingUpi);
                    const otp = Math.floor(100000 + Math.random() * 900000).toString();
                    setUpiGeneratedOtp(otp);
                    setUpiOtpSent(true);
                    showToast(`Verify new UPI OTP: ${otp}`, 'success');
                    setSensitiveAction(null);
                    setSensitiveOtp('');
                    setModal({ open: false, type: '', data: null });
                } else if (sensitiveAction === 'withdraw' && modal.data?.investmentId) {
                    setSensitiveAction(null);
                    setSensitiveOtp('');
                    setModal({
                        open: true,
                        type: 'confirmWithdraw',
                        data: {
                            investmentId: modal.data.investmentId,
                            amount: modal.data.amount,
                            bankAccount: modal.data.bankAccount,
                            ifsc: modal.data.ifsc,
                            accountName: modal.data.accountName,
                        },
                    });
                } else {
                    setSensitiveAction(null);
                    setSensitiveOtp('');
                    setModal({ open: false, type: '', data: null });
                }
            }, [sensitiveOtp, sensitiveGeneratedOtp, sensitiveAction, modal, user, playSound, showToast]);

            const logoutAllDevices = useCallback(() => {
                playSound(clickSound);
                mockUsers[user.email].activeSessions = 1;
                if (!mockUsers[user.email].securityLog) mockUsers[user.email].securityLog = [];
                mockUsers[user.email].securityLog.push({ action: 'LOGOUT_ALL', at: new Date().toISOString() });
                saveMockUsers(mockUsers);
                const updated = { ...user, activeSessions: 1 };
                setUser(updated);
                localStorage.setItem('user', JSON.stringify(updated));
                showToast('Logged out from all other devices.', 'success');
                setModal({ open: false, type: '', data: null });
            }, [user, playSound, showToast]);

            const handleKycVerification = useCallback(() => {
                playSound(clickSound);
                setKycStep(1);
                setKycForm({ pan: '', aadhaar: '', mobile: '', mobileOtp: '', bankAccount: '', ifsc: '', accountName: '' });
                setKycMobileOtpSent(false);
                setKycGeneratedOtp('');
                setModal({ open: true, type: 'kycFlow', data: null });
            }, [playSound]);

            // Step 1 → validate identity → send OTP for Aadhaar + mobile link
            const submitKycDetails = useCallback(() => {
                playSound(clickSound);
                const pan = kycForm.pan.trim().toUpperCase();
                const aadhaar = kycForm.aadhaar.replace(/\s/g, '');
                const mobile = kycForm.mobile.replace(/\s/g, '');

                if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan)) {
                    showToast('Enter a valid PAN (e.g. ABCDE1234F).', 'error');
                    return;
                }
                if (!/^\d{12}$/.test(aadhaar)) {
                    showToast('Enter a valid 12-digit Aadhaar number.', 'error');
                    return;
                }
                if (!/^[6-9]\d{9}$/.test(mobile)) {
                    showToast('Enter a valid 10-digit mobile number.', 'error');
                    return;
                }
                setKycGeneratedOtp('123456');
                setKycMobileOtpSent(true);
                setKycStep(2);
                showToast('OTP sent to verify Aadhaar & mobile linkage.', 'success');
            }, [kycForm, playSound, showToast]);

            // Step 2 → verify OTP → Bank
            const verifyKycMobileOtp = useCallback(() => {
                playSound(clickSound);
                if (kycForm.mobileOtp !== kycGeneratedOtp) {
                    showToast('Invalid OTP. Please try again.', 'error');
                    return;
                }
                setKycStep(3);
                showToast('Aadhaar & mobile verified successfully.', 'success');
            }, [kycForm.mobileOtp, kycGeneratedOtp, playSound, showToast]);

            // Dummy stubs (biometric removed)
            const startBiometricScan = useCallback(() => { }, []);
            const proceedAfterBiometric = useCallback(() => { }, []);

            // Step 4 → final submit
            const submitKycBank = useCallback(() => {
                playSound(clickSound);
                const { bankAccount, ifsc, accountName } = kycForm;
                // Bank account is required — primary payout method
                if (!accountName.trim()) {
                    showToast('Enter account holder name.', 'error');
                    return;
                }
                if (!/^\d{9,18}$/.test((bankAccount || '').replace(/\s/g, ''))) {
                    showToast('Enter a valid bank account number (9–18 digits).', 'error');
                    return;
                }
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test((ifsc || '').trim().toUpperCase())) {
                    showToast('Enter a valid IFSC code.', 'error');
                    return;
                }
                setLoading(true);
                setTimeout(() => {
                    const kycData = {
                        pan: kycForm.pan.trim().toUpperCase(),
                        aadhaar: kycForm.aadhaar.replace(/\s/g, ''),
                        mobile: kycForm.mobile.replace(/\s/g, ''),
                        bankAccount: kycForm.bankAccount.replace(/\s/g, '') || null,
                        ifsc: kycForm.ifsc.trim().toUpperCase() || null,
                        accountName: kycForm.accountName.trim() || null,
                        aadhaarMobileLinked: true,
                        verifiedAt: new Date().toISOString(),
                    };
                    mockUsers[user.email].kycStatus = 'Verified';
                    mockUsers[user.email].kycData = kycData;
                    if (!mockUsers[user.email].securityLog) mockUsers[user.email].securityLog = [];
                    mockUsers[user.email].securityLog.push({
                        action: 'KYC_VERIFIED',
                        at: new Date().toISOString(),
                        detail: 'Aadhaar + Mobile OTP',
                    });
                    saveMockUsers(mockUsers);
                    const updatedUser = { ...user, kycStatus: 'Verified', kycData };
                    setUser(updatedUser);
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    setMessage('KYC completed. Aadhaar & mobile linked successfully.');
                    showToast('Identity verification completed.', 'success');
                    setLoading(false);
                    playSound(notificationSound);
                    setModal({ open: false, type: '', data: null });
                    setKycStep(1);
                    setBiometricStatus('idle');
                }, 1000);
            }, [kycForm, user, biometricType, playSound, showToast]);

            const confirmKycVerification = useCallback(() => {
                submitKycBank();
            }, [submitKycBank]);

            const confirmBankTransfer = useCallback(() => {
                const { orderId, amount } = modal.data;
                setLoading(true);
                try {
                    setTimeout(() => {
                        const investment = {
                            id: Date.now(),
                            amount,
                            date: new Date().toISOString(),
                            returns: 0,
                            order_id: orderId,
                            status: 'Pending Bank Transfer',
                        };
                        mockUsers[user.email].investments.push(investment);
                        saveMockUsers(mockUsers);
                        setUser({ ...user, investments: mockUsers[user.email].investments });
                        setMessage(`Bank transfer request of ₹${amount.toLocaleString('en-IN')} submitted. Order ID: ${orderId}. Account details will be shared shortly.`);
                        showToast('Transfer request submitted successfully.', 'success');
                        setInvestmentAmount('');
                        setLoading(false);
                        playSound(depositSound);
                    }, 1000);
                } catch (error) {
                    setMessage('Error submitting bank transfer request.');
                    showToast('Request failed.', 'error');
                    setLoading(false);
                    playSound(notificationSound);
                }
                setModal({ open: false, type: '', data: null });
            }, [user, modal, playSound, showToast]);

            return (
                <ErrorBoundary>

                            </div>
                            <p className="text-gray-600 text-sm sm:text-base mt-1 dark:text-gray-400">Investment platform · Target up to 2% monthly</p>
                        </header>
                        {message && (
                            <div className="w-full max-w-md mb-6 p-4 bg-blue-100 text-blue-800 rounded-lg shadow-md fade-in text-base dark:bg-blue-900 dark:text-blue-200">{message}</div>

                        {loading && (

                                <div className="spinner mr-2"></div>
                                <span>Loading...</span>
                            </div>

                        {toast.message && (

                            </div>

                                            </label>

                                                    checked={isDarkMode}

                                            </label>

                                    <Dashboard user={user} />

                                        <div className="space-y-3">
                                            {/* ===== 3-LAYER ACCORDION ===== */}

                                            {/* LAYER 1 — Security & Account */}
                                            <div className="rounded-xl border border-gray-200 overflow-hidden dark:border-gray-600">

                                                        Security & Account
                                                    </span>

                                                            <button type="button" onClick={() => {

                                                        <i className="fas fa-id-badge mr-2 text-blue-600"></i>
                                                        Identity & Payout
                                                        <span className={`ml-2 px-2 py-0.5 rounded-full text-xs font-semibold ${user.kycStatus === 'Verified' ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200' : 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200'}`}>
                                                            {user.kycStatus === 'Verified' ? 'Verified' : 'Not Verified'}
                                                        </span>
