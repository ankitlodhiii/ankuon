<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkuOn2 — Investment Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/payments.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .soft-glow {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 40px rgba(16, 185, 129, 0.08);
        }

        .btn-mail {
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-mail:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }

        .btn-mail:active {
            transform: scale(0.98);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .btn-primary {
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .tab {
            border-bottom: 2px solid transparent;
        }

        .tab-active {
            border-bottom: 2px solid #10b981;
            color: #10b981;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 90%;
            width: 500px;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .modal-content.hidden {
            transform: scale(0.95);
            opacity: 0;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            cursor: pointer;
            font-size: 20px;
            color: #4b5563;
        }

        .modal-close:hover {
            color: #10b981;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 90%;
            width: 400px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.hidden {
            transform: translateY(20px);
            opacity: 0;
        }

        .toast-error {
            background: #ef4444;
        }

        .toast-close {
            cursor: pointer;
            margin-left: 16px;
            font-size: 16px;
        }

        .toast-close:hover {
            color: #e5e7eb;
        }

        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 16px auto;
            border: 4px solid #f3f3f3;
            border-radius: 8px;
            display: block;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            background: #f3f3f3;
            padding: 8px;
            border-radius: 8px;
        }

        .progress-step {
            flex: 1;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            padding: 8px;
            border-radius: 4px;
            margin: 0 4px;
        }

        .progress-step.active {
            background: #10b981;
            color: white;
        }

        .section-header {
            cursor: pointer;
        }

        .payment-method-box {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .payment-method-box.active {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .payment-method-box:hover {
            border-color: #10b981;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #10b981;
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .tooltip {
            position: relative;
        }

        .tooltip:hover:after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }

        .input-valid {
            border-color: #10b981 !important;
        }

        .input-invalid {
            border-color: #ef4444 !important;
        }

        .dark body {
            background-color: #1f2937;
            color: #f3f4f6;
        }

        .dark .bg-white {
            background-color: #374151;
        }

        .dark .bg-gray-50 {
            background-color: #4b5563;
        }

        .dark .bg-gray-100 {
            background-color: #4b5563;
        }

        .dark .text-gray-800 {
            color: #d1d5db;
        }

        .dark .text-gray-700 {
            color: #d1d5db;
        }

        .dark .text-gray-600 {
            color: #9ca3af;
        }

        .dark .text-gray-500 {
            color: #9ca3af;
        }

        .dark .border-gray-300 {
            border-color: #6b7280;
        }

        .dark .border-gray-200 {
            border-color: #4b5563;
        }

        .dark .modal-content {
            background: #374151;
            color: #f3f4f6;
        }

        .dark .payment-method-box {
            border-color: #6b7280;
        }

        .dark .payment-method-box.active {
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.15);
        }

        .dark body,
        body.dark-shell {
            background-color: #0f172a;
            color: #f1f5f9;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, memo } = React;
        const { createRoot } = ReactDOM;

        // ============================================================
        // PRODUCTION CONFIG — replace with your real values
        // ============================================================
        const CONFIG = {
            // Local:  'http://127.0.0.1:8000/api'
            // Live:   'https://ankuon.onrender.com/api'
            API_BASE: 'http://127.0.0.1:8000/api',
            CASHFREE_MODE: 'sandbox',
            CASHFREE_APP_ID: 'YOUR_CASHFREE_APP_ID',
            MIN_INVEST_AMOUNT: 10000,
            MAX_INVEST_AMOUNT: 10000000,
            MAX_UPI_AMOUNT: 500000,
            MONTHLY_RETURN_RATE: 0.02,
            OTP_RESEND_COOLDOWN: 60,
            WITHDRAWAL_CANCELLATION_WINDOW_MS: 2 * 24 * 60 * 60 * 1000,
            WITHDRAWAL_PROCESSING_DAYS: 3,
            USE_VIRTUAL_ACCOUNT: true,
            COMPANY_BANK: {
                accountName: 'AnkuOn2',
                accountNumber: '42452996309',
                ifsc: 'SBIN0012171',
                bankName: 'State Bank of India',
            },
        };

        // ============================================================
        // API LAYER — all network calls go through here
        // ============================================================
        const api = {
            async request(path, options = {}) {
                const token = localStorage.getItem('authToken');
                const headers = {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...options.headers,
                };
                const res = await fetch(`${CONFIG.API_BASE}${path}`, {
                    ...options,
                    headers,
                    credentials: 'include',
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const err = new Error(data.message || data.error || `Request failed (${res.status})`);
                    err.status = res.status;
                    err.data = data;
                    throw err;
                }
                return data;
            },

            sendOtp: (email, name) =>
                api.request('/send-otp/', {
                    method: 'POST',
                    body: JSON.stringify({ email, name }),
                }),
            verifyOtp: (email, otp) =>
                api.request('/verify-otp/', {
                    method: 'POST',
                    body: JSON.stringify({ email, otp }),
                }),
            logout: () =>
                api.request('/update-profile/', { method: 'POST', body: JSON.stringify({}) }).catch(() => ({})),
            logoutAllDevices: () => Promise.resolve({}),

            getProfile: () => api.request('/profile/'),
            updateProfile: (payload) =>
                api.request('/update-profile/', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                }),

            submitKycIdentity: (payload) =>
                api.request('/kyc-verification/', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                }),
            verifyKycOtp: (payload) =>
                api.request('/kyc-verification/', {
                    method: 'POST',
                    body: JSON.stringify({ ...payload, otp_verified: true }),
                }),
            submitKycBank: (payload) =>
                api.request('/kyc-verification/', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                }),
            addBank: (payload) =>
                api.request('/kyc-verification/', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                }),
            setPrimaryBank: (bankId) =>
                api.request('/kyc-verification/', {
                    method: 'POST',
                    body: JSON.stringify({ bankId }),
                }),

            createPaymentOrder: (payload) =>
                api.request('/invest/', {
                    method: 'POST',
                    body: JSON.stringify({
                        amount: payload.amount,
                        payment_method: payload.paymentMethod || payload.payment_method,
                        paymentMethod: payload.paymentMethod || payload.payment_method,
                        requestVirtualAccount: payload.requestVirtualAccount !== false,
                        upiId: payload.upiId,
                    }),
                }),
            verifyPayment: (payload) =>
                api.request(`/check-transaction/${payload.orderId || payload.order_id}/`, {
                    method: 'GET',
                }),
            getInvestments: () => api.request('/profile/'),
            requestWithdrawal: (payload) =>
                api.request('/withdraw/', {
                    method: 'POST',
                    body: JSON.stringify({
                        investment_id: payload.investmentId || payload.investment_id,
                        amount: payload.amount,
                    }),
                }),
            cancelWithdrawal: (withdrawalId) =>
                api.request('/cancel-withdrawal/', {
                    method: 'POST',
                    body: JSON.stringify({ withdrawal_id: withdrawalId }),
                }),
            getWithdrawals: () => api.request('/profile/'),

            toggle2FA: (enable) => Promise.resolve({}),
            verifySensitiveAction: (payload) => Promise.resolve({ ok: true }),
            updateUpi: (payload) =>
                api.request('/update-profile/', {
                    method: 'POST',
                    body: JSON.stringify({ upi_id: payload.upiId || payload.upi_id }),
                }),
        };

        // ============================================================
        // HELPERS
        // ============================================================
        const isWithdrawalCancellable = (requestedDate) =>
            Date.now() - new Date(requestedDate).getTime() < CONFIG.WITHDRAWAL_CANCELLATION_WINDOW_MS;

        const maskUpi = (upi) => {
            if (!upi || upi.length < 5) return upi || '—';
            const [name, handle] = upi.split('@');
            if (!handle) return '••••••';
            const maskedName = name.length <= 2 ? '••' : name.slice(0, 2) + '••••';
            return `${maskedName}@${handle}`;
        };
        const maskPan = (pan) => {
            if (!pan || pan.length < 6) return '••••••••••';
            return pan.slice(0, 3) + '••••' + pan.slice(-1);
        };
        const maskAadhaar = (aadhaar) => {
            if (!aadhaar || aadhaar.length < 4) return 'XXXX-XXXX-XXXX';
            return 'XXXX-XXXX-' + aadhaar.slice(-4);
        };
        const maskMobile = (mobile) => {
            if (!mobile || mobile.length < 4) return '******';
            return '******' + mobile.slice(-4);
        };
        const maskBank = (acc) => {
            if (!acc || acc.length < 4) return '****';
            return '****' + acc.slice(-4);
        };
        const maskIfsc = (ifsc) => {
            if (!ifsc || ifsc.length < 6) return '***********';
            return ifsc.slice(0, 4) + '*******';
        };

        const sanitizeInput = (input) =>
            String(input || '').replace(/[<>&'"]/g, '');

        const useDebounce = (value, delay) => {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        };

        const clickSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/click.wav');
        clickSound.volume = 0.4;
        clickSound.preload = 'auto';
        const notificationSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/notification.wav');
        notificationSound.volume = 0.4;
        notificationSound.preload = 'auto';
        const depositSound = new Audio('https://cdn.jsdelivr.net/gh/xai-org/grok-artifact-assets@sounds/deposit.wav');
        depositSound.volume = 0.4;
        depositSound.preload = 'auto';

        const resourcesData = {
            information: [
                { id: 1, title: 'Platform Update', content: 'Seamless settlement via UPI, QR, and high-value bank transfers (NEFT / RTGS / IMPS) for all client allocations.' },
                { id: 2, title: 'Investment Philosophy', content: 'Disciplined capital deployment, transparent monthly returns, and institutional-grade reporting for every client.' },
                { id: 3, title: 'Client Focus', content: 'Serving individual and institutional investors with secure, compliant investment solutions.' },
            ],
            notes: [
                { id: 1, content: 'UPI and QR payments are available up to ₹5 Lakh. Higher amounts are processed via NEFT / RTGS / IMPS.' },
                { id: 2, content: 'All withdrawals are paid only to your verified bank account via NEFT / RTGS / IMPS.' },
                { id: 3, content: 'KYC verification is mandatory before investing or requesting a withdrawal.' },
            ],
            quotes: [
                { id: 1, content: '"In investing, what is comfortable is rarely profitable." – Robert Arnott' },
                { id: 2, content: '"The stock market is a device for transferring money from the impatient to the patient." – Warren Buffett' },
                { id: 3, content: '"Risk comes from not knowing what you are doing." – Warren Buffett' },
            ],
        };

        // ============================================================
        // ERROR BOUNDARY
        // ============================================================
        class ErrorBoundary extends React.Component {
            state = { error: null };
            static getDerivedStateFromError(error) {
                return { error: error.message || 'Unexpected error' };
            }
            render() {
                if (this.state.error) {
                    return (
                        <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">
                            <h1 className="text-4xl font-extrabold text-red-600 mb-8">Something Went Wrong</h1>
                            <div className="mb-6 p-6 bg-red-100 text-red-800 rounded-lg shadow-lg max-w-md text-center">
                                <p>{this.state.error}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-4 p-2 bg-emerald-600 text-white rounded-lg btn-primary"
                                >
                                    Retry
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        // ============================================================
        // CLOCK
        // ============================================================
        const Clock = memo(() => {
            const [currentTime, setCurrentTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 10000);
                return () => clearInterval(timer);
            }, []);
            const formatDateTime = (date) =>
                new Intl.DateTimeFormat('en-IN', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                    hour: 'numeric', minute: 'numeric', second: 'numeric',
                    timeZone: 'Asia/Kolkata', timeZoneName: 'short',
                }).format(date);
            return <p className="text-gray-600 text-base dark:text-gray-400">{formatDateTime(currentTime)}</p>;
        });

        // ============================================================
        // LOGIN FORM
        // ============================================================
        const LoginForm = memo(({ setUser, setMessage, setLoading, loading, playSound }) => {
            const [formState, setFormState] = useState({ email: '', name: '', otp: '' });
            const [otpSent, setOtpSent] = useState(false);
            const [resendCooldown, setResendCooldown] = useState(0);

            useEffect(() => {
                if (otpSent && resendCooldown > 0) {
                    const timer = setTimeout(() => setResendCooldown(resendCooldown - 1), 1000);
                    return () => clearTimeout(timer);
                }
            }, [otpSent, resendCooldown]);

            const sendOtp = useCallback(async (e) => {
                e.preventDefault();
                playSound(clickSound);
                const email = sanitizeInput(formState.email.trim());
                const name = sanitizeInput(formState.name.trim());
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    setMessage('Please enter a valid email address.');
                    return;
                }
                if (!name) {
                    setMessage('Please enter your full name.');
                    return;
                }
                setLoading(true);
                try {
                    await api.sendOtp(email, name);
                    setOtpSent(true);
                    setResendCooldown(CONFIG.OTP_RESEND_COOLDOWN);
                    setMessage(`OTP sent to ${email}. Please check your email / SMS.`);
                    playSound(notificationSound);
                } catch (err) {
                    setMessage(err.message || 'Failed to send OTP. Please try again.');
                } finally {
                    setLoading(false);
                }
            }, [formState, setMessage, setLoading, playSound]);

            const verifyOtp = useCallback(async (e) => {
                e.preventDefault();
                playSound(clickSound);
                const email = sanitizeInput(formState.email.trim());
                const otp = formState.otp.trim();
                if (!otp || otp.length !== 6) {
                    setMessage('Please enter the 6-digit OTP.');
                    return;
                }
                setLoading(true);
                try {
                    const data = await api.verifyOtp(email, otp);
                    if (data.token) {
                        localStorage.setItem('authToken', data.token);
                    }
                    const userData = data.user || { email, name: formState.name, ...data };
                    setUser(userData);
                    localStorage.setItem('user', JSON.stringify(userData));
                    setOtpSent(false);
                    setFormState({ email: '', name: '', otp: '' });
                    setMessage('Login successful. Welcome to AnkuOn2.');
                    playSound(notificationSound);
                } catch (err) {
                    setMessage(err.message || 'Invalid OTP. Please try again.');
                } finally {
                    setLoading(false);
                }
            }, [formState, setUser, setMessage, setLoading, playSound]);

            return (
                <div className="w-full max-w-md bg-white p-6 sm:p-8 rounded-xl shadow-2xl fade-in dark:bg-gray-800">
                    <h2 className="text-xl sm:text-2xl font-semibold text-gray-800 mb-6 dark:text-gray-200">
                        {otpSent ? 'Enter OTP' : 'Login / Register'}
                    </h2>
                    {!otpSent ? (
                        <form onSubmit={sendOtp} className="space-y-4">
                            <div>
                                <label htmlFor="name" className="block text-base font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                                <input
                                    id="name" type="text" placeholder="Enter your full name"
                                    value={formState.name}
                                    onChange={(e) => setFormState(prev => ({ ...prev, name: e.target.value }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required autoFocus aria-required="true"
                                />
                            </div>
                            <div>
                                <label htmlFor="email" className="block text-base font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                                <input
                                    id="email" type="email" placeholder="Enter your email"
                                    value={formState.email}
                                    onChange={(e) => setFormState(prev => ({ ...prev, email: e.target.value }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required aria-required="true"
                                />
                            </div>
                            <button type="submit" className="w-full p-3 bg-emerald-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base" disabled={loading} aria-label="Send OTP">
                                <i className="fas fa-paper-plane mr-2"></i> Send OTP
                            </button>
                        </form>
                    ) : (
                        <form onSubmit={verifyOtp} className="space-y-4">
                            <div>
                                <label htmlFor="otp" className="block text-base font-medium text-gray-700 dark:text-gray-300">OTP</label>
                                <input
                                    id="otp" type="text" placeholder="Enter 6-digit OTP"
                                    value={formState.otp}
                                    onChange={(e) => setFormState(prev => ({ ...prev, otp: e.target.value.replace(/\D/g, '').slice(0, 6) }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                    required maxLength="6" autoFocus aria-required="true" autoComplete="one-time-code"
                                />
                            </div>
                            <button type="submit" className="w-full p-3 bg-emerald-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base" disabled={loading} aria-label="Verify OTP">
                                <i className="fas fa-check mr-2"></i> Verify OTP
                            </button>
                            <button type="button" onClick={sendOtp} className="w-full p-3 bg-green-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base" disabled={resendCooldown > 0 || loading} aria-label="Resend OTP">

                    const totalReturn = amount * CONFIG.MONTHLY_RETURN_RATE * month;
                    returns.push({
                        month,
                        return: totalReturn.toFixed(2),
                        total: (amount + totalReturn).toFixed(2),
                    });
                }
                return returns;
            }, []);

            if (!user.investments || user.investments.length === 0) {
                return (
                    <p className="text-gray-600 text-base flex items-center dark:text-gray-400">

            return (

                            .map((inv) => {
                                const pendingWithdrawal = (user.withdrawals || []).find(
                                    (wd) => wd.investmentId === inv.id && wd.status === 'Pending'
                                );
                                const completedWithdrawal = (user.withdrawals || []).find(
                                    (wd) => wd.investmentId === inv.id && wd.status === 'Completed'
                                );
                                const isWithdrawn = !!completedWithdrawal;
                                const isDetailsVisible = selectedInvestmentId === inv.id;
                                const projectedReturns = calculateProjectedReturns(inv);
                                const displayStatus = isWithdrawn ? 'Withdrawn' : (pendingWithdrawal ? 'Withdrawal Pending' : inv.status);
                                return (
                                    <li key={inv.id} className={`p-4 rounded-lg shadow-sm dark:bg-gray-700 ${isWithdrawn ? 'bg-gray-100 opacity-75' : 'bg-gray-50'}`}>
                                        <p className="text-gray-800 text-base dark:text-gray-200">Amount: ₹{(Number(inv.amount) || 0).toLocaleString('en-IN')}</p>
                                        <p className="text-gray-800 text-base dark:text-gray-200">Returns (2% monthly): ₹{(Number(inv.returns) || 0).toLocaleString('en-IN')}</p>
                                        <p className="text-gray-600 text-sm dark:text-gray-400">Date: {new Date(inv.date).toLocaleDateString('en-IN')}</p>
                                        <p className="text-gray-600 text-sm dark:text-gray-400">Order ID: {inv.order_id || 'N/A'}</p>
                                        <p className={`text-sm font-medium ${isWithdrawn ? 'text-gray-500' : pendingWithdrawal ? 'text-orange-600' : 'text-green-600'}`}>
                                            Status: {displayStatus}
                                        </p>
                                        <div className="mt-3 flex flex-col sm:flex-row sm:space-x-3 space-y-2 sm:space-y-0">
                                            {isWithdrawn ? (
                                                <p className="text-gray-500 text-base flex items-center dark:text-gray-400">
                                                    <i className="fas fa-check-circle mr-2"></i> Fully withdrawn
                                                </p>
                                            ) : pendingWithdrawal ? (
                                                isWithdrawalCancellable(pendingWithdrawal.requested) ? (
                                                    <button onClick={() => handleCancelWithdrawal(pendingWithdrawal.id)}
                                                        className="p-2 bg-red-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                                        disabled={loading} aria-label="Cancel withdrawal">
                                                        <i className="fas fa-ban mr-2"></i> Cancel Withdrawal
                                                    </button>
                                                ) : (
                                                    <p className="text-orange-600 text-base flex items-center dark:text-orange-400">
                                                        <i className="fas fa-clock mr-2"></i> Withdrawal processing
                                                    </p>
                                                )
                                            ) : (
                                                <button onClick={() => handleWithdraw(inv.id)}
                                                    className="p-2 bg-yellow-500 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                                    disabled={loading || user.kycStatus !== 'Verified'} aria-label="Request withdrawal">
                                                    <i className="fas fa-money-bill-wave mr-2"></i> Withdraw
                                                </button>
                                            )}
                                            <button onClick={() => { playSound(clickSound); setSelectedInvestmentId(isDetailsVisible ? null : inv.id); }}
                                                className="p-2 bg-green-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                                disabled={loading} aria-label={isDetailsVisible ? 'Hide details' : 'View details'}>
                                                <i className="fas fa-eye mr-2"></i> {isDetailsVisible ? 'Hide Details' : 'View Details'}
                                            </button>
                                        </div>
                                        {isDetailsVisible && (
                                            <div className="mt-4 p-4 bg-gray-100 rounded-lg shadow-inner dark:bg-gray-600">
                                                <h4 className="text-base font-semibold text-gray-800 mb-2 dark:text-gray-200">Investment Details</h4>
                                                <p className="text-gray-800 text-base dark:text-gray-200">Date: {new Date(inv.date).toLocaleDateString('en-IN')}</p>
                                                <p className="text-gray-800 text-base dark:text-gray-200">Amount: ₹{(Number(inv.amount) || 0).toLocaleString('en-IN')}</p>
                                                <p className="text-gray-800 text-base dark:text-gray-200">Order ID: {inv.order_id || 'N/A'}</p>
                                                <h5 className="text-base font-semibold text-gray-800 mt-3 mb-1 dark:text-gray-200">Projected Returns (2% monthly)</h5>
                                                <ul className="space-y-2">
                                                    {projectedReturns.slice(0, 3).map((ret) => (
                                                        <li key={ret.month} className="text-gray-800 text-base dark:text-gray-200">
                                                            Month {ret.month}: ₹{ret.return} (Total: ₹{ret.total})
                                                        </li>
                                                    ))}
                                                    {projectedReturns.length > 3 && (
                                                        <p className="text-gray-600 text-sm dark:text-gray-400">...and more (up to 12 months)</p>
                                                    )}
                                                </ul>
                                            </div>
                                        )}
                                    </li>
                                );
                            })}
                    </ul>
                    {user.investments.length > ITEMS_PER_PAGE && (
                        <button onClick={() => { playSound(clickSound); setShowAllInvestments(!showAllInvestments); }}
                            className="p-2 text-emerald-600 hover:text-emerald-800 font-medium text-base flex items-center dark:text-emerald-400 dark:hover:text-emerald-300"
                            aria-label={showAllInvestments ? 'Show fewer investments' : 'Show more investments'}>
                            <i className="fas fa-arrow-down mr-2"></i> {showAllInvestments ? 'Show Less' : 'See More'}
                        </button>
                    )}
                </>
            );
        });

        // ============================================================
        // WITHDRAWAL LIST
        // ============================================================
        const WithdrawalList = memo(({ user, showAllWithdrawals, setShowAllWithdrawals, playSound }) => {
            const ITEMS_PER_PAGE = 3;
            if (!user.withdrawals || user.withdrawals.length === 0) {
                return (
                    <p className="text-gray-600 text-base flex items-center dark:text-gray-400">
                        <i className="fas fa-info-circle mr-2 text-emerald-600"></i> No withdrawal requests yet.
                    </p>
                );
            }
            return (
                <>
                    <ul className="mb-6 space-y-4">
                        {user.withdrawals
                            .slice(0, showAllWithdrawals ? user.withdrawals.length : ITEMS_PER_PAGE)
                            .map((wd) => (
                                <li key={wd.id} className="p-4 bg-gray-50 rounded-lg shadow-sm dark:bg-gray-700">
                                    <p className="text-gray-800 text-base dark:text-gray-200">Amount: ₹{(Number(wd.amount) || 0).toLocaleString('en-IN')}</p>
                                    <p className="text-gray-800 text-base dark:text-gray-200">Status: {wd.status}</p>
                                    <p className="text-gray-600 text-sm dark:text-gray-400">Requested: {new Date(wd.requested).toLocaleDateString('en-IN')}</p>
                                    <p className="text-gray-600 text-sm dark:text-gray-400">
                                        Bank: {maskBank(wd.bankAccount || '')}
                                        {wd.ifsc ? ` · ${maskIfsc(wd.ifsc)}` : ''}
                                    </p>
                                    <p className="text-gray-600 text-sm dark:text-gray-400">Method: {wd.method || 'NEFT/RTGS/IMPS'}</p>
                                    {wd.status === 'Pending' && wd.processingEnd && (
                                        <p className="text-gray-600 text-sm dark:text-gray-400">
                                            Processing Until: {new Date(wd.processingEnd).toLocaleDateString('en-IN')}
                                        </p>
                                    )}
                                    {wd.status === 'Pending' && !isWithdrawalCancellable(wd.requested) && (
                                        <p className="mt-2 text-orange-600 text-base flex items-center dark:text-orange-400">
                                            <i className="fas fa-clock mr-2"></i> Withdrawal processing
                                        </p>
                                    )}
                                </li>
                            ))}
                    </ul>
                    {user.withdrawals.length > ITEMS_PER_PAGE && (
                        <button onClick={() => { playSound(clickSound); setShowAllWithdrawals(!showAllWithdrawals); }}
                            className="p-2 text-emerald-600 hover:text-emerald-800 font-medium text-base flex items-center dark:text-emerald-400 dark:hover:text-emerald-300"
                            aria-label={showAllWithdrawals ? 'Show fewer withdrawals' : 'Show more withdrawals'}>
                            <i className="fas fa-arrow-down mr-2"></i> {showAllWithdrawals ? 'Show Less' : 'See More'}
                        </button>
                    )}
                </>
            );
        });
        // ============================================================
        // MAIN APP
        // ============================================================
        const App = () => {
            const [user, setUser] = useState(() => {
                try {
                    const stored = localStorage.getItem('user');
                    return stored ? JSON.parse(stored) : null;
                } catch {
                    return null;
                }
            });
            const [message, setMessage] = useState('');
            const [loading, setLoading] = useState(false);
            const [isSoundEnabled, setIsSoundEnabled] = useState(() => localStorage.getItem('isSoundEnabled') === 'true');
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('isDarkMode') === 'true');
            const [activeTab, setActiveTab] = useState('information');
            const [showAllInvestments, setShowAllInvestments] = useState(false);
            const [showAllWithdrawals, setShowAllWithdrawals] = useState(false);
            const [selectedInvestmentId, setSelectedInvestmentId] = useState(null);
            const [showInvestments, setShowInvestments] = useState(true);
            const [showWithdrawals, setShowWithdrawals] = useState(true);
            const [openLayer, setOpenLayer] = useState(1);
            const [modal, setModal] = useState({ open: false, type: '', data: null });
            const [toast, setToast] = useState({ message: '', type: 'success' });
            const [toastQueue, setToastQueue] = useState([]);
            const [investmentAmount, setInvestmentAmount] = useState('');
            const [upiId, setUpiId] = useState('');
            const [updatedName, setUpdatedName] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('qr');
            const [userUpiIdForCollect, setUserUpiIdForCollect] = useState('');
            const [isUpiValid, setIsUpiValid] = useState(null);

            const [kycStep, setKycStep] = useState(1);
            const [kycForm, setKycForm] = useState({
                pan: '', aadhaar: '', mobile: '', mobileOtp: '',
                bankAccount: '', ifsc: '', accountName: '',
            });
            const [kycDetailOpen, setKycDetailOpen] = useState(null);

            const [sensitiveAction, setSensitiveAction] = useState(null);
            const [sensitiveOtp, setSensitiveOtp] = useState('');

            const [showUpiChange, setShowUpiChange] = useState(false);
            const [pendingUpi, setPendingUpi] = useState('');
            const [upiVerifyOtp, setUpiVerifyOtp] = useState('');
            const [upiOtpSent, setUpiOtpSent] = useState(false);

            useEffect(() => { localStorage.setItem('isSoundEnabled', isSoundEnabled); }, [isSoundEnabled]);
            useEffect(() => {
                localStorage.setItem('isDarkMode', isDarkMode);
                document.documentElement.classList.toggle('dark', isDarkMode);
            }, [isDarkMode]);

            useEffect(() => {
                const unlock = () => {
                    if (isSoundEnabled) {
                        [clickSound, notificationSound, depositSound].forEach(a => {
                            a.play().catch(() => { });
                            a.pause();
                            a.currentTime = 0;
                        });
                        window.removeEventListener('click', unlock);
                    }
                };
                window.addEventListener('click', unlock);
                return () => window.removeEventListener('click', unlock);
            }, [isSoundEnabled]);

            useEffect(() => {
                if (userUpiIdForCollect) {
                    setIsUpiValid(/^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/.test(userUpiIdForCollect));
                } else {
                    setIsUpiValid(null);
                }
            }, [userUpiIdForCollect]);

            useEffect(() => {
                if (paymentMethod === 'qr') {
                    setUserUpiIdForCollect('');
                    setIsUpiValid(null);
                }
            }, [paymentMethod]);

            useEffect(() => {
                if (!user?.email || !localStorage.getItem('authToken')) return;
                let cancelled = false;
                (async () => {
                    try {
                        const profile = await api.getProfile();
                        if (!cancelled && profile) {
                            setUser(prev => ({ ...prev, ...profile }));
                            localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                        }
                    } catch (e) {
                        if (e.status === 401) {
                            localStorage.removeItem('authToken');
                            localStorage.removeItem('user');
                            setUser(null);
                        }
                    }
                })();
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                let timer;
                if (toast.message) {
                    timer = setTimeout(() => {
                        setToast({ message: '', type: 'success' });
                        if (toastQueue.length > 0) {
                            const next = toastQueue[0];
                            setToast(next);
                            setToastQueue(prev => prev.slice(1));
                            if (isSoundEnabled) notificationSound.play().catch(() => { });
                        }
                    }, 7000);
                }
                return () => clearTimeout(timer);
            }, [toast, toastQueue, isSoundEnabled]);

            const playSound = useCallback((audio) => {
                if (!isSoundEnabled || !audio) return;
                try {
                    const p = audio.play();
                    if (p && typeof p.catch === 'function') p.catch(() => { });
                } catch (_) { }
            }, [isSoundEnabled]);

            const showToast = useCallback((msg, type = 'success') => {
                if (toast.message) {
                    if (!toastQueue.some(t => t.message === msg)) {
                        setToastQueue(prev => [...prev, { message: msg, type }]);
                    }
                } else {
                    setToast({ message: msg, type });
                    if (isSoundEnabled) notificationSound.play().catch(() => { });
                }
            }, [toast.message, toastQueue, isSoundEnabled]);

            const dismissToast = useCallback(() => {
                playSound(clickSound);
                setToast({ message: '', type: 'success' });
                setToastQueue([]);
            }, [playSound]);

            const toggleLayer = useCallback((layer) => {
                playSound(clickSound);
                setOpenLayer(prev => (prev === layer ? null : layer));
            }, [playSound]);

            const handleInvest = useCallback(async (e) => {
                e.preventDefault();
                playSound(clickSound);
                const amount = parseFloat(investmentAmount.replace(/[^0-9]/g, ''));
                if (!user) {
                    setMessage('Please log in to invest.');
                    showToast('Login required.', 'error');
                    return;
                }
                if (isNaN(amount) || amount < CONFIG.MIN_INVEST_AMOUNT) {
                    setMessage(`Minimum investment is ₹${CONFIG.MIN_INVEST_AMOUNT.toLocaleString('en-IN')}.`);
                    showToast(`Minimum amount is ₹${CONFIG.MIN_INVEST_AMOUNT.toLocaleString('en-IN')}.`, 'error');
                    return;
                }
                if (amount > CONFIG.MAX_INVEST_AMOUNT) {
                    setMessage(`Maximum investment is ₹${CONFIG.MAX_INVEST_AMOUNT.toLocaleString('en-IN')}.`);
                    showToast(`Maximum amount is ₹${CONFIG.MAX_INVEST_AMOUNT.toLocaleString('en-IN')}.`, 'error');
                    return;
                }
                if (user.kycStatus !== 'Verified') {
                    setMessage('Please complete KYC verification to proceed.');
                    showToast('KYC verification required.', 'error');
                    return;
                }
                if (amount > CONFIG.MAX_UPI_AMOUNT && (paymentMethod === 'qr' || paymentMethod === 'collect')) {
                    setMessage(`Amounts above ₹${CONFIG.MAX_UPI_AMOUNT.toLocaleString('en-IN')} must use bank transfer.`);
                    showToast('UPI/QR not available above ₹5 Lakh.', 'error');
                    return;
                }
                if (paymentMethod === 'collect' && !isUpiValid) {
                    setMessage('Please enter a valid UPI ID.');
                    showToast('Invalid UPI ID.', 'error');
                    return;
                }

                setLoading(true);
                try {
                    const generateOrderId = () => {
                        const d = new Date();
                        const datePart = d.toISOString().slice(0, 10).replace(/-/g, '');
                        const randomPart = Math.floor(10000 + Math.random() * 90000);
                        return `AO2-${datePart}-${randomPart}`;
                    };

                    let order = { orderId: generateOrderId() };

                    try {
                        const orderPayload = {
                            amount,
                            paymentMethod,
                            upiId: paymentMethod === 'collect' ? userUpiIdForCollect : undefined,
                            requestVirtualAccount: paymentMethod === 'bank' && CONFIG.USE_VIRTUAL_ACCOUNT,
                        };
                        const apiOrder = await api.createPaymentOrder(orderPayload);
                        if (apiOrder && apiOrder.orderId) {
                            order = apiOrder;
                        }
                    } catch (apiErr) {
                        console.warn('Backend order creation not available, using local Order ID:', order.orderId);
                    }

                    if (paymentMethod === 'bank') {
                        const virtualAccount = order.virtualAccount || order.va || null;
                        setModal({
                            open: true,
                            type: 'bankTransfer',
                            data: {
                                amount,
                                orderId: order.orderId,
                                virtualAccount: virtualAccount && virtualAccount.accountNumber ? virtualAccount : null,
                            },
                        });
                    } else if (paymentMethod === 'qr') {
                        setModal({
                            open: true,
                            type: 'showQRCode',
                            data: {
                                qrData: order.qrData || order.paymentLink,
                                amount,
                                orderId: order.orderId,
                                paymentSessionId: order.paymentSessionId,
                            },
                        });
                        if (order.paymentSessionId && window.Cashfree) {
                            const cashfree = window.Cashfree({ mode: CONFIG.CASHFREE_MODE });
                            cashfree.checkout({
                                paymentSessionId: order.paymentSessionId,
                                redirectTarget: '_modal',
                            }).then((result) => {
                                if (result.error) {
                                    showToast(result.error.message || 'Payment failed', 'error');
                                }
                            });
                        }
                    } else if (paymentMethod === 'collect') {
                        setModal({
                            open: true,
                            type: 'upiCollectPending',
                            data: {
                                amount,
                                orderId: order.orderId,
                                upiId: userUpiIdForCollect,
                                paymentSessionId: order.paymentSessionId,
                            },
                        });
                    }
                } catch (err) {
                    setMessage(err.message || 'Could not initiate payment.');
                    showToast(err.message || 'Payment initiation failed.', 'error');
                } finally {
                    setLoading(false);
                }
            }, [user, investmentAmount, userUpiIdForCollect, isUpiValid, paymentMethod, playSound, showToast]);

            const confirmPayment = useCallback(async () => {
                if (!modal.data?.orderId) return;
                setLoading(true);
                try {
                    const result = await api.verifyPayment({
                        orderId: modal.data.orderId,
                        paymentSessionId: modal.data.paymentSessionId,
                    });
                    const profile = await api.getProfile();
                    setUser(prev => ({ ...prev, ...profile }));
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                    setMessage(`Invested ₹${modal.data.amount.toLocaleString('en-IN')} successfully. Order ID: ${modal.data.orderId}`);
                    showToast(`Invested ₹${modal.data.amount.toLocaleString('en-IN')} successfully!`, 'success');
                    setInvestmentAmount('');
                    playSound(depositSound);
                } catch (err) {
                    setMessage(err.message || 'Payment verification failed.');
                    showToast(err.message || 'Payment verification failed.', 'error');
                } finally {
                    setLoading(false);
                    setModal({ open: false, type: '', data: null });
                }
            }, [user, modal, showToast, playSound]);

            const confirmUpiCollect = useCallback(async () => {
                await confirmPayment();
            }, [confirmPayment]);

            const confirmBankTransfer = useCallback(async () => {
                if (!modal.data?.orderId) return;
                setLoading(true);
                try {
                    try {
                        await api.createPaymentOrder({
                            amount: modal.data.amount,
                            paymentMethod: 'bank',
                            orderId: modal.data.orderId,
                            status: 'Pending Bank Transfer',
                        });
                    } catch (_) { }

                    try {
                        const profile = await api.getProfile();
                        setUser(prev => ({ ...prev, ...profile }));
                        localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                    } catch (_) { }

                    const isVA = !!(modal.data.virtualAccount && modal.data.virtualAccount.accountNumber);
                    if (isVA) {
                        setMessage(
                            `Please transfer ₹${modal.data.amount.toLocaleString('en-IN')} to the unique virtual account shown. Order ID ${modal.data.orderId} will be matched automatically. We will confirm after receiving the money.`
                        );
                    } else {
                        setMessage(
                            `Please transfer ₹${modal.data.amount.toLocaleString('en-IN')} to Account 42452996309 (IFSC: SBIN0012171). Put Order ID ${modal.data.orderId} in the remarks. We will confirm after receiving the money.`
                        );
                    }
                    showToast('Complete the bank transfer using the details shown.', 'success');
                    setInvestmentAmount('');
                    playSound(depositSound);
                } catch (err) {
                    setMessage(err.message || 'Request failed.');
                    showToast(err.message || 'Request failed.', 'error');
                } finally {
                    setLoading(false);
                    setModal({ open: false, type: '', data: null });
                }
            }, [user, modal, showToast, playSound]);

            const handleWithdraw = useCallback(async (investmentId) => {
                playSound(clickSound);
                if (!user) {
                    showToast('Login required.', 'error');
                    return;
                }
                if (user.kycStatus !== 'Verified') {
                    showToast('KYC verification required.', 'error');
                    return;
                }
                if (!user.kycData?.bankAccount) {
                    showToast('Verified bank account required for withdrawals.', 'error');
                    return;
                }
                const investment = (user.investments || []).find(inv => inv.id === investmentId);
                if (!investment) {
                    showToast('Investment not found.', 'error');
                    return;
                }
                try {
                    await api.verifySensitiveAction({ action: 'withdraw', investmentId });
                    setSensitiveAction('withdraw');
                    setSensitiveOtp('');
                    showToast('Verification OTP sent to your registered mobile / email.', 'success');
                    setModal({
                        open: true,
                        type: 'sensitiveVerify',
                        data: {
                            action: 'withdraw',
                            investmentId,
                            amount: (Number(investment.amount) || 0) + (Number(investment.returns) || 0),
                            bankAccount: user.kycData.bankAccount,
                            ifsc: user.kycData.ifsc,
                            accountName: user.kycData.accountName,
                        },
                    });
                } catch (err) {
                    showToast(err.message || 'Could not initiate withdrawal verification.', 'error');
                }
            }, [user, playSound, showToast]);

            const confirmWithdraw = useCallback(async () => {
                const { investmentId, amount } = modal.data || {};
                setLoading(true);
                try {
                    await api.requestWithdrawal({
                        investmentId,
                        amount,
                        otp: sensitiveOtp,
                    });
                    const profile = await api.getProfile();
                    setUser(prev => ({ ...prev, ...profile }));
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                    setMessage(`Withdrawal of ₹${amount.toLocaleString('en-IN')} requested. Processing in ${CONFIG.WITHDRAWAL_PROCESSING_DAYS} days.`);
                    showToast('Withdrawal requested to your verified bank account.', 'success');
                    playSound(notificationSound);
                } catch (err) {
                    showToast(err.message || 'Withdrawal request failed.', 'error');
                } finally {
                    setLoading(false);
                    setModal({ open: false, type: '', data: null });
                    setSensitiveAction(null);
                    setSensitiveOtp('');
                }
            }, [user, modal, sensitiveOtp, playSound, showToast]);

            const handleCancelWithdrawal = useCallback((withdrawalId) => {
                playSound(clickSound);
                const withdrawal = (user.withdrawals || []).find(wd => wd.id === withdrawalId);
                if (!withdrawal) {
                    showToast('Withdrawal not found.', 'error');
                    return;
                }
                if (!isWithdrawalCancellable(withdrawal.requested)) {
                    showToast('Cannot cancel: withdrawal is past the cancellation window.', 'error');
                    return;
                }
                setModal({ open: true, type: 'confirmCancelWithdrawal', data: { withdrawalId } });
            }, [user, playSound, showToast]);

            const confirmCancelWithdrawal = useCallback(async () => {
                const { withdrawalId } = modal.data || {};
                setLoading(true);
                try {
                    await api.cancelWithdrawal(withdrawalId);
                    const profile = await api.getProfile();
                    setUser(prev => ({ ...prev, ...profile }));
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                    showToast('Withdrawal cancelled successfully.', 'success');
                    playSound(notificationSound);
                } catch (err) {
                    showToast(err.message || 'Cancellation failed.', 'error');
                } finally {
                    setLoading(false);
                    setModal({ open: false, type: '', data: null });
                }
            }, [user, modal, playSound, showToast]);

            const handleUpdateProfile = useCallback((e) => {
                if (e && e.preventDefault) e.preventDefault();
                playSound(clickSound);
                const name = sanitizeInput(updatedName.trim()) || (user?.name || '');
                if (!name) {
                    showToast('Name is required.', 'error');
                    return;
                }
                const trimmedUpi = sanitizeInput(upiId.trim());
                if (trimmedUpi && !/^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/.test(trimmedUpi)) {
                    showToast('Invalid UPI ID.', 'error');
                    return;
                }
                setModal({
                    open: true,
                    type: 'confirmUpdateProfile',
                    data: { name, upiId: trimmedUpi },
                });
            }, [user, updatedName, upiId, playSound, showToast]);

            const confirmUpdateProfile = useCallback(async () => {
                const { name, upiId: newUpi } = modal.data || {};
                try {
                    await api.updateProfile({ name, upiId: newUpi || undefined });
                    const updated = { ...user, name, upiId: newUpi || user.upiId };
                    setUser(updated);
                    localStorage.setItem('user', JSON.stringify(updated));
                    showToast('Profile updated.', 'success');
                    setUpiId('');
                    playSound(notificationSound);
                } catch (err) {
                    showToast(err.message || 'Profile update failed.', 'error');
                }
                setModal({ open: false, type: '', data: null });
            }, [user, modal, playSound, showToast]);

            const toggle2FA = useCallback(async () => {
                playSound(clickSound);
                try {
                    if (user.twoFactorEnabled) {
                        await api.verifySensitiveAction({ action: 'disable2fa' });
                        setSensitiveAction('disable2fa');
                        setSensitiveOtp('');
                        setModal({ open: true, type: 'sensitiveVerify', data: { action: 'disable2fa' } });
                        showToast('Verification OTP sent.', 'success');
                    } else {
                        await api.toggle2FA(true);
                        const updated = { ...user, twoFactorEnabled: true };
                        setUser(updated);
                        localStorage.setItem('user', JSON.stringify(updated));
                        showToast('Two-factor authentication enabled.', 'success');
                    }
                } catch (err) {
                    showToast(err.message || 'Could not update 2FA.', 'error');
                }
            }, [user, playSound, showToast]);

            const confirmSensitiveAction = useCallback(async () => {
                playSound(clickSound);
                if (!sensitiveOtp || sensitiveOtp.length !== 6) {
                    showToast('Enter a valid 6-digit OTP.', 'error');
                    return;
                }
                try {
                    if (sensitiveAction === 'disable2fa') {
                        await api.toggle2FA(false);
                        const updated = { ...user, twoFactorEnabled: false };
                        setUser(updated);
                        localStorage.setItem('user', JSON.stringify(updated));
                        showToast('Two-factor authentication disabled.', 'success');
                        setModal({ open: false, type: '', data: null });
                    } else if (sensitiveAction === 'withdraw' && modal.data?.investmentId) {
                        await api.verifySensitiveAction({
                            action: 'withdraw',
                            investmentId: modal.data.investmentId,
                            otp: sensitiveOtp,
                        });
                        setModal({
                            open: true,
                            type: 'confirmWithdraw',
                            data: { ...modal.data },
                        });
                    }
                } catch (err) {
                    showToast(err.message || 'Invalid verification code.', 'error');
                } finally {
                    setSensitiveAction(null);
                    setSensitiveOtp('');
                }
            }, [sensitiveOtp, sensitiveAction, modal, user, playSound, showToast]);

            const logoutAllDevices = useCallback(async () => {
                playSound(clickSound);
                try {
                    await api.logoutAllDevices();
                    showToast('Logged out from all other devices.', 'success');

                    showToast(err.message || 'Failed to logout other devices.', 'error');

                setModal({ open: false, type: '', data: null });
            }, [playSound, showToast]);

            const handleKycVerification = useCallback(() => {
                playSound(clickSound);
                setKycStep(1);
                setKycForm({ pan: '', aadhaar: '', mobile: '', mobileOtp: '', bankAccount: '', ifsc: '', accountName: '' });
                setModal({ open: true, type: 'kycFlow', data: null });
            }, [playSound]);

            const submitKycDetails = useCallback(async () => {
                playSound(clickSound);
                const pan = kycForm.pan.trim().toUpperCase();
                const aadhaar = kycForm.aadhaar.replace(/\s/g, '');
                const mobile = kycForm.mobile.replace(/\s/g, '');
                if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan)) {
                    showToast('Enter a valid PAN (e.g. ABCDE1234F).', 'error');
                    return;
                }
                if (!/^\d{12}$/.test(aadhaar)) {
                    showToast('Enter a valid 12-digit Aadhaar number.', 'error');
                    return;
                }
                if (!/^[6-9]\d{9}$/.test(mobile)) {
                    showToast('Enter a valid 10-digit mobile number.', 'error');
                    return;
                }
                try {
                    await api.submitKycIdentity({ pan, aadhaar, mobile });
                    setKycStep(2);
                    showToast('OTP sent to verify Aadhaar & mobile linkage.', 'success');
                } catch (err) {
                    showToast(err.message || 'Could not start KYC.', 'error');
                }
            }, [kycForm, playSound, showToast]);

            const verifyKycMobileOtp = useCallback(async () => {
                playSound(clickSound);
                if (!kycForm.mobileOtp || kycForm.mobileOtp.length !== 6) {
                    showToast('Enter the 6-digit OTP.', 'error');
                    return;
                }
                try {
                    await api.verifyKycOtp({
                        mobile: kycForm.mobile,
                        otp: kycForm.mobileOtp,
                        aadhaar: kycForm.aadhaar,
                    });
                    setKycStep(3);
                    showToast('Aadhaar & mobile verified successfully.', 'success');
                } catch (err) {
                    showToast(err.message || 'Invalid OTP.', 'error');
                }
            }, [kycForm, playSound, showToast]);

            const submitKycBank = useCallback(async () => {
                playSound(clickSound);
                const { bankAccount, ifsc, accountName } = kycForm;
                if (!accountName.trim()) {
                    showToast('Enter account holder name.', 'error');
                    return;
                }
                if (!/^\d{9,18}$/.test((bankAccount || '').replace(/\s/g, ''))) {
                    showToast('Enter a valid bank account number (9–18 digits).', 'error');
                    return;
                }
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test((ifsc || '').trim().toUpperCase())) {
                    showToast('Enter a valid IFSC code.', 'error');
                    return;
                }
                setLoading(true);
                try {
                    await api.submitKycBank({
                        accountName: accountName.trim(),
                        bankAccount: bankAccount.replace(/\s/g, ''),
                        ifsc: ifsc.trim().toUpperCase(),
                        pan: kycForm.pan,
                        aadhaar: kycForm.aadhaar,
                        mobile: kycForm.mobile,

                    const profile = await api.getProfile();
                    setUser(prev => ({ ...prev, ...profile }));
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                    showToast('Identity verification completed.', 'success');
                    playSound(notificationSound);
                    setModal({ open: false, type: '', data: null });
                    setKycStep(1);
                } catch (err) {
                    showToast(err.message || 'KYC completion failed.', 'error');

                    setLoading(false);
                }

            const openAddBankModal = useCallback(() => {
                playSound(clickSound);
                if (user?.kycStatus !== 'Verified') {
                    showToast('Complete KYC before adding a bank account.', 'error');
                    return;
                }

                if (banks.length >= 2) {
                    showToast('Maximum 2 bank accounts allowed.', 'error');
                    return;
                }
                setKycForm({ pan: '', aadhaar: '', mobile: '', mobileOtp: '', bankAccount: '', ifsc: '', accountName: '' });

            const submitAddBank = useCallback(async () => {

                    showToast('Enter account holder name.', 'error');

                    setModal({ open: false, type: '', data: null });

            const setPrimaryBank = useCallback(async (bankId) => {

                    setUser(prev => ({ ...prev, ...profile }));

            const handleLogout = useCallback(async () => {
                playSound(clickSound);
                try {
                    await api.logout();

                localStorage.removeItem('user');

                                                    </span>

                                                    <i className={`fas fa-chevron-${openLayer === 2 ? 'up' : 'down'} text-gray-500`}></i>
                                                </button>
                                                {openLayer === 2 && (

                                                        {user.kycStatus !== 'Verified' ? (

                                                                {user.kycData?.bankAccount && (

                                                                <button type="button" onClick={openAddBankModal}
