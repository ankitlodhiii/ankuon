                                                {openLayer === 3 && (
                                                    <div className="p-4 space-y-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-600">
                                                        <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 dark:bg-amber-900/20 dark:border-amber-700 space-y-1">
                                                            <p className="text-xs font-semibold uppercase tracking-wide text-amber-800 dark:text-amber-200">Investment Disclosure</p>
                                                            <p className="text-xs text-amber-900 dark:text-amber-100 leading-relaxed">
                                                                Target return: up to 2% per month on invested capital. Returns are not guaranteed. Past performance is not indicative of future results. Withdrawal processing may take up to 3 business days.
                                                            </p>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Right column — Invest */}
                                        <div>
                                            <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center dark:text-gray-200">
                                                <i className="fas fa-money-check-alt mr-2 text-emerald-600"></i> Invest in AnkuOn2
                                            </h3>
                                            {user.kycStatus !== 'Verified' && (
                                                <div className="mb-4 p-4 bg-amber-50 border border-amber-300 rounded-xl dark:bg-amber-900/20 dark:border-amber-600">
                                                    <p className="text-sm font-semibold text-amber-900 dark:text-amber-200 flex items-center">
                                                        <i className="fas fa-exclamation-triangle mr-2"></i> KYC required before investing
                                                    </p>
                                                    <button type="button" onClick={handleKycVerification}
                                                        className="mt-3 w-full p-2.5 bg-emerald-600 text-white rounded-lg text-sm font-medium btn-primary">
                                                        <i className="fas fa-id-badge mr-2"></i> Complete KYC Now
                                                    </button>
                                                </div>
                                            )}
                                            <form onSubmit={handleInvest} className="space-y-4">
                                                <div>
                                                    <label htmlFor="investmentAmount" className="block text-base font-medium text-gray-700 dark:text-gray-300 mb-1">Enter Investment Amount</label>
                                                    <input
                                                        id="investmentAmount" type="text" placeholder="Enter investment amount"
                                                        value={investmentAmount ? `₹${parseInt(investmentAmount.replace(/[^0-9]/g, '') || '0').toLocaleString('en-IN')}` : ''}
                                                        onChange={(e) => {
                                                            const raw = e.target.value.replace(/[^0-9]/g, '');
                                                            setInvestmentAmount(raw);
                                                            const amt = parseInt(raw || '0');
                                                            if (amt > CONFIG.MAX_UPI_AMOUNT) setPaymentMethod('bank');
                                                            else if (paymentMethod === 'bank') setPaymentMethod('qr');
                                                        }}
                                                        className="w-full p-4 text-lg border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                                                        required aria-required="true"
                                                    />
                                                    <div className="flex flex-wrap gap-2 mt-3">
                                                        {[10000, 50000, 100000, 500000].map((add) => (
                                                            <button key={add} type="button"
                                                                onClick={() => {
                                                                    playSound(clickSound);
                                                                    const current = parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0');
                                                                    let next = current + add;
                                                                    if (next > CONFIG.MAX_INVEST_AMOUNT) next = CONFIG.MAX_INVEST_AMOUNT;
                                                                    setInvestmentAmount(String(next));
                                                                    if (next > CONFIG.MAX_UPI_AMOUNT) setPaymentMethod('bank');
                                                                    else if (paymentMethod === 'bank') setPaymentMethod('qr');
                                                                }}
                                                                className="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-sm font-medium btn-primary dark:bg-emerald-900 dark:text-emerald-300">
                                                                +₹{add >= 100000 ? (add / 100000) + 'L' : (add / 1000) + 'k'}
                                                            </button>
                                                        ))}
                                                        <button type="button" onClick={() => { playSound(clickSound); setInvestmentAmount(''); setPaymentMethod('qr'); }}
                                                            className="px-3 py-1.5 bg-gray-200 text-gray-700 rounded-full text-sm font-medium btn-primary dark:bg-gray-600 dark:text-gray-200">
                                                            Clear
                                                        </button>
                                                    </div>
                                                </div>

                                                {(() => {
                                                    const amt = parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0');
                                                    if (amt < CONFIG.MIN_INVEST_AMOUNT) return null;
                                                    if (amt > CONFIG.MAX_UPI_AMOUNT) {
                                                        return (
                                                            <div className="space-y-3">
                                                                <div className="p-3 bg-orange-50 border border-orange-300 rounded-lg text-sm text-orange-800 dark:bg-orange-900/30 dark:border-orange-600 dark:text-orange-200">
                                                                    <i className="fas fa-lock mr-2"></i>
                                                                    <strong>UPI / QR locked</strong> — amounts above ₹5 Lakh must use bank transfer.
                                                                </div>
                                                                <div className={`payment-method-box ${paymentMethod === 'bank' ? 'active' : ''} dark:border-gray-600`}
                                                                    onClick={() => { playSound(clickSound); setPaymentMethod('bank'); }}>
                                                                    <div className="flex items-center mb-2">
                                                                        <i className="fas fa-university mr-2 text-emerald-600 text-xl"></i>
                                                                        <input type="radio" id="bankMethod" name="paymentMethod" value="bank" checked={paymentMethod === 'bank'} onChange={() => setPaymentMethod('bank')} className="mr-2" />
                                                                        <label htmlFor="bankMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Net Banking / NEFT / RTGS / IMPS</label>
                                                                    </div>
                                                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                                                        High-value settlement via Net Banking, NEFT, RTGS or IMPS. Account details will be shared after confirmation.
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        );
                                                    }
                                                    return (
                                                        <div className="space-y-3">
                                                            <p className="text-sm font-medium text-gray-600 dark:text-gray-400">Choose payment method (UPI limit: ₹5 Lakh)</p>
                                                            <div className={`payment-method-box ${paymentMethod === 'qr' ? 'active' : ''} dark:border-gray-600`}
                                                                onClick={() => { playSound(clickSound); setPaymentMethod('qr'); }}>
                                                                <div className="flex items-center mb-1">
                                                                    <i className="fas fa-qrcode mr-2 text-emerald-600 text-xl"></i>
                                                                    <input type="radio" id="qrMethod" name="paymentMethod" value="qr" checked={paymentMethod === 'qr'} onChange={() => setPaymentMethod('qr')} className="mr-2" />
                                                                    <label htmlFor="qrMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Pay with QR Code</label>
                                                                </div>
                                                                <p className="text-sm text-gray-600 dark:text-gray-400">Scan QR using any UPI app.</p>
                                                            </div>
                                                            <div className={`payment-method-box ${paymentMethod === 'collect' ? 'active' : ''} dark:border-gray-600`}
                                                                onClick={() => { playSound(clickSound); setPaymentMethod('collect'); }}>
                                                                <div className="flex items-center mb-1">
                                                                    <i className="fas fa-mobile-alt mr-2 text-emerald-600 text-xl"></i>
                                                                    <input type="radio" id="collectMethod" name="paymentMethod" value="collect" checked={paymentMethod === 'collect'} onChange={() => setPaymentMethod('collect')} className="mr-2" />
                                                                    <label htmlFor="collectMethod" className="text-base font-medium text-gray-700 dark:text-gray-300">Pay with UPI Request</label>
                                                                </div>
                                                                <p className="text-sm text-gray-600 dark:text-gray-400">Approve request in your UPI app.</p>
                                                                {paymentMethod === 'collect' && (
                                                                    <div className="mt-3">
                                                                        <label htmlFor="userUpiIdForCollect" className="block text-sm font-medium text-gray-700 dark:text-gray-300">Your UPI ID</label>
                                                                        <input id="userUpiIdForCollect" type="text" placeholder="e.g., yourname@upi"
                                                                            value={userUpiIdForCollect}
                                                                            onChange={(e) => setUserUpiIdForCollect(e.target.value)}
                                                                            className={`w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-gray-700 dark:text-white ${isUpiValid === true ? 'input-valid' : isUpiValid === false ? 'input-invalid' : 'border-gray-300 dark:border-gray-600'}`} />
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })()}

                                                <button type="submit"
                                                    className="w-full p-3 bg-emerald-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                                    disabled={
                                                        loading ||
                                                        user.kycStatus !== 'Verified' ||
                                                        !investmentAmount ||
                                                        parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0') < CONFIG.MIN_INVEST_AMOUNT ||
                                                        parseInt((investmentAmount || '0').replace(/[^0-9]/g, '') || '0') > CONFIG.MAX_INVEST_AMOUNT ||
                                                        (paymentMethod === 'collect' && !isUpiValid)
                                                    }
                                                    aria-label="Proceed to payment">
                                                    <i className="fas fa-arrow-right mr-2"></i> Proceed
                                                </button>
                                            </form>
                                        </div>
                                    </div>

                                    <button onClick={handleLogout}
                                        className="w-full p-3 bg-red-600 text-white rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center text-base"
                                        disabled={loading} aria-label="Logout">
                                        <i className="fas fa-sign-out-alt mr-2"></i> Logout
                                    </button>
                                </div>

                                <div className="bg-white p-6 sm:p-8 rounded-xl shadow-2xl fade-in dark:bg-gray-800">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 section-header flex items-center dark:text-gray-200"
                                        onClick={() => { playSound(clickSound); setShowInvestments(!showInvestments); }}>
                                        <i className="fas fa-chart-bar mr-2 text-emerald-600"></i> Your Investments {showInvestments ? '▼' : '▶'}
                                    </h3>
                                    {showInvestments && (
                                        <InvestmentList
                                            user={user}
                                            handleWithdraw={handleWithdraw}
                                            handleCancelWithdrawal={handleCancelWithdrawal}
                                            selectedInvestmentId={selectedInvestmentId}
                                            setSelectedInvestmentId={setSelectedInvestmentId}
                                            showAllInvestments={showAllInvestments}
                                            setShowAllInvestments={setShowAllInvestments}
                                            loading={loading}
                                            playSound={playSound}
                                        />
                                    )}
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 section-header mt-6 flex items-center dark:text-gray-200"
                                        onClick={() => { playSound(clickSound); setShowWithdrawals(!showWithdrawals); }}>
                                        <i className="fas fa-hand-holding-usd mr-2 text-emerald-600"></i> Withdrawal Requests {showWithdrawals ? '▼' : '▶'}
                                    </h3>
                                    {showWithdrawals && (
                                        <WithdrawalList
                                            user={user}
                                            showAllWithdrawals={showAllWithdrawals}
                                            setShowAllWithdrawals={setShowAllWithdrawals}
                                            playSound={playSound}
                                        />
                                    )}
                                    <Resources activeTab={activeTab} setActiveTab={setActiveTab} playSound={playSound} />
                                </div>
                            </div>
                        )}

                        <Modal
                            modal={modal}
                            setModal={setModal}
                            confirmPayment={confirmPayment}
                            confirmUpiCollect={confirmUpiCollect}
                            confirmWithdraw={confirmWithdraw}
                            confirmCancelWithdrawal={confirmCancelWithdrawal}
                            confirmUpdateProfile={confirmUpdateProfile}
                            confirmBankTransfer={confirmBankTransfer}
                            confirmSensitiveAction={confirmSensitiveAction}
                            logoutAllDevices={logoutAllDevices}
                            loading={loading}
                            playSound={playSound}
                            kycStep={kycStep}
                            kycForm={kycForm}
                            setKycForm={setKycForm}
                            submitKycDetails={submitKycDetails}
                            verifyKycMobileOtp={verifyKycMobileOtp}
                            submitKycBank={submitKycBank}
                            submitAddBank={submitAddBank}
                            sensitiveOtp={sensitiveOtp}
                            setSensitiveOtp={setSensitiveOtp}
                        />

                        <section className="w-full max-w-lg mt-10 mb-6">
                            <div className="rounded-3xl border border-slate-200/80 bg-white/80 backdrop-blur soft-glow p-6 sm:p-8 text-center dark:border-white/10 dark:bg-slate-900/60">
                                <p className="text-sm text-slate-500 dark:text-slate-400">
                                    For investment-related information or support, contact the founder directly.
                                </p>
                                <div className="mt-5 rounded-2xl border border-slate-200 bg-slate-50/80 p-5 dark:border-white/10 dark:bg-white/5">
                                    <div className="flex items-center justify-center gap-3">
                                        <div className="flex h-11 w-11 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-500">
                                            <i className="fas fa-user text-lg"></i>
                                        </div>
                                        <div className="text-left">
                                            <p className="text-xs text-slate-500 dark:text-slate-500">Founder</p>
                                            <p className="font-semibold text-slate-900 dark:text-white">Ankit Lodhi</p>
                                        </div>
                                    </div>
                                    <a href="mailto:ankitlodhiii06@gmail.com?subject=AnkuOn2%20Investment%20Inquiry"
                                        className="btn-mail mt-5 flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-500 px-5 py-3.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400">
                                        <i className="fas fa-envelope"></i> Email Founder
                                    </a>
                                    <p className="mt-3 text-xs text-slate-500 select-all dark:text-slate-400">ankitlodhiii06@gmail.com</p>
                                </div>
                            </div>
                        </section>

                        <footer className="mt-4 mb-8 w-full max-w-5xl text-center">
                            <p className="text-xs text-slate-500 dark:text-slate-600">© 2026 AnkuOn2. All rights reserved.</p>
                            <p className="mt-2 text-xs leading-5 text-slate-500 dark:text-slate-600">
                                Invest responsibly. Returns are not guaranteed. Past performance is not indicative of future results.
                            </p>
                        </footer>
                    </div>
                </ErrorBoundary>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
